<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>menu test</title>
<!-- Loaded by test/menu-test.sh. At phone width, opens the header's Menu button on several public pages (also after
     scrolling) and checks that the links open under the bar, are all on screen and at least 44px tall, that nothing
     scrolls sideways, and that the Menu button closes them again (click or Escape, focus back on the button). -->
</head><body><pre id="out"></pre><div id="frames"></div>
<script>
const out = document.getElementById("out"); let failures = 0;
const report = (ok, name, detail) => { if (!ok) failures++; out.textContent += `${ok ? "ok  " : "FAIL"} ${name}${!ok && detail ? ` -- ${detail}` : ""}\n`; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function openPage(url, w, h) {
  const f = document.createElement("iframe");
  f.style.cssText = `width:${w}px;height:${h}px;border:0`;
  document.getElementById("frames").append(f);
  f.src = "/" + url;
  const ready = () => { try { const d = f.contentWindow.document; return f.contentWindow.location.href !== "about:blank" && !!d.querySelector(".nav-toggle"); } catch (e) { return false; } };
  for (let i = 0; i < 200 && !ready(); i++) await sleep(50);
  await sleep(300);
  return { frame: f, win: f.contentWindow, doc: f.contentWindow.document };
}
(async () => {
  const W = 390, H = 700;
  for (const [url, scroll] of [["index.html", 0], ["index.html", 600], ["robots.html", 0], ["about.html", 300], ["member.html", 0]]) {
    const { frame, win, doc } = await openPage(url, W, H);
    win.scrollTo(0, scroll); await sleep(200);
    const label = `${url} (scrolled ${scroll}px)`;
    const btn = doc.querySelector(".nav-toggle"), nav = doc.querySelector(".site-nav"), header = doc.querySelector(".site-header");
    const br = btn.getBoundingClientRect();
    report(br.width >= 44 && br.height >= 44 && br.left >= 0 && br.right <= W, `${label}: the Menu button is at least 44px and on screen`, `${Math.round(br.width)}x${Math.round(br.height)}`);
    report(win.getComputedStyle(nav).display === "none" && btn.getAttribute("aria-expanded") === "false", `${label}: the links are closed at first`);
    btn.click(); await sleep(150);
    report(header.classList.contains("open") && btn.getAttribute("aria-expanded") === "true", `${label}: the menu opens (aria-expanded true)`);
    const hr = header.getBoundingClientRect();
    report(Math.abs(hr.top) < 2, `${label}: the bar stays at the top of the screen`, `top ${Math.round(hr.top)}`);
    const links = [...nav.querySelectorAll("a")];
    report(links.length >= 6, `${label}: five page links and the login button are there`, `${links.length} links`);
    const bad = links.filter((a) => { const r = a.getBoundingClientRect(); return r.width < 1 || r.height < 44 || r.left < 0 || r.right > W || r.bottom > H; });
    report(bad.length === 0, `${label}: every menu item is on screen and at least 44px tall`, bad.map((a) => a.textContent.trim()).join(", "));
    report(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `${label}: nothing scrolls sideways with the menu open`);
    btn.focus(); win.document.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    header.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true })); await sleep(100);
    report(!header.classList.contains("open") && doc.activeElement === btn, `${label}: Escape closes the menu and keeps focus on the button`);
    btn.click(); await sleep(100); btn.click(); await sleep(100);
    report(!header.classList.contains("open") && btn.getAttribute("aria-expanded") === "false", `${label}: the button closes the menu again`);
    frame.remove();
  }
  report(failures === 0, `ALL CHECKS (${failures} failures)`);
  const done = document.createElement("div"); done.id = "done"; done.textContent = failures === 0 ? "MENU-TEST-PASS" : "MENU-TEST-FAIL"; document.body.append(done);
})();
</script></body></html>
