<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>theme test</title>
<!-- Loaded by test/theme-test.sh in headless Chrome. mode=contrast: the public pages (dark only, Midnight & brass)
     and the themed pages (portal, install, offline) in light and dark: WCAG AA text contrast. mode=system-light /
     system-dark: Chrome is started with that system setting; themed pages must follow it and public pages must stay dark,
     also with a saved light choice. mode=nogroup: the portal for a user with no group. One line per check goes into #out. -->
</head>
<body>
<pre id="out">
</pre>
<div id="frames"></div>
<script>
const MODE = new URLSearchParams(location.search).get("mode") || "contrast";
const out = document.getElementById("out");
let failures = 0;
function report(ok, name, detail) {
  if (!ok) failures++;
  out.textContent += `${ok ? "ok  " : "FAIL"} ${MODE}: ${name}${!ok && detail ? ` -- ${detail}` : ""}\n`;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- colour maths (WCAG 2.x) ----------
function parse(str) {
  const m = String(str).match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number);
  return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
}
const over = (top, under) => { const a = top[3]; return [top[0] * a + under[0] * (1 - a), top[1] * a + under[1] * (1 - a), top[2] * a + under[2] * (1 - a)]; };
const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
const ratio = (a, b) => { const [hi, lo] = lum(a) >= lum(b) ? [a, b] : [b, a]; return (lum(hi) + 0.05) / (lum(lo) + 0.05); };
const key = (c) => c.map((v) => Math.round(v)).join(",");

// Text on a photo: the public pages put no text over photographs (docs/PUBLIC_REDESIGN_PROPOSAL.md §4), so there is no
// worst-case photo to assume. (Kept as a list in case a page ever needs one.)
const ON_PHOTO = [];
const OVER_ANYTHING = ".never-matches";

// Every colour the element's own background could be: solid colours and each stop of a gradient, over each possibility below it.
function backgroundsOf(win, el) {
  let cands = [[255, 255, 255]];
  const chain = [];
  for (let n = el; n; n = n.parentElement) chain.unshift(n);
  for (const n of chain) {
    const photo = ON_PHOTO.find((p) => n.matches(p.sel));
    if (photo) cands = [photo.layers.reduce((acc, l) => over(l, acc), photo.base)];
    else if (n.matches(OVER_ANYTHING)) cands = [[255, 255, 255], [0, 0, 0]];
    const cs = win.getComputedStyle(n);
    if (!photo) {
      const bg = parse(cs.backgroundColor);
      if (bg && bg[3] > 0) cands = cands.map((c) => over(bg, c));
      if (cs.backgroundImage && cs.backgroundImage.includes("gradient(") && cs.webkitBackgroundClip !== "text" && cs.backgroundClip !== "text") {
        const stops = (cs.backgroundImage.match(/rgba?\([^)]*\)/g) || []).map(parse).filter(Boolean);
        const next = new Map();
        for (const c of cands) { next.set(key(c), c); for (const s of stops) { const v = over(s, c); next.set(key(v), v); } }
        cands = [...next.values()].slice(0, 80);
      }
    } else {
      const bg = parse(cs.backgroundColor);
      if (bg && bg[3] > 0 && n !== chain.find((x) => x.matches(photo.sel))) cands = cands.map((c) => over(bg, c));
    }
  }
  return cands;
}

function opacityOf(win, el) {
  let o = 1;
  for (let n = el; n; n = n.parentElement) o *= parseFloat(win.getComputedStyle(n).opacity);
  return o;
}

function textColorsOf(win, el) {
  const cs = win.getComputedStyle(el);
  const c = parse(cs.color);
  if (c && c[3] > 0) return [c];
  if (cs.webkitBackgroundClip === "text" || cs.backgroundClip === "text") {          // gradient text: every stop
    return (cs.backgroundImage.match(/rgba?\([^)]*\)/g) || []).map(parse).filter((x) => x && x[3] > 0);
  }
  return [];
}

function describe(el) {
  const cls = typeof el.className === "string" && el.className.trim() ? "." + el.className.trim().split(/\s+/).slice(0, 2).join(".") : "";
  return `<${el.tagName.toLowerCase()}${cls}> "${(el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 28)}"`;
}

// Checks all visible text and icons on a page. Returns { checked, min, failures[] }.
function contrastOf(win, doc) {
  const fails = [];
  let checked = 0, min = 99;
  const test = (el, textColors, bgs, need, what) => {
    let worst = 99;
    for (const bg of bgs) for (const t of textColors) {
      const o = opacityOf(win, el);
      const fg = t[3] < 1 || o < 1 ? over([t[0], t[1], t[2], t[3] * o], bg) : t;
      worst = Math.min(worst, ratio(fg, bg));
    }
    checked++; min = Math.min(min, worst);
    if (worst < need) fails.push(`${what} ${describe(el)} ${worst.toFixed(2)}:1 (needs ${need})`);
  };
  for (const el of doc.body.querySelectorAll("*")) {
    if (["SCRIPT", "STYLE", "NOSCRIPT", "TEMPLATE", "IFRAME", "IMG", "PATH", "CIRCLE", "RECT", "LINE", "G"].includes(el.tagName.toUpperCase())) continue;
    if (el.closest('[aria-hidden="true"], [hidden], .sr, .cursor-dot')) continue;
    if (!el.getClientRects().length) continue;
    const cs = win.getComputedStyle(el);
    if (cs.visibility === "hidden" || cs.display === "none" || opacityOf(win, el) < 0.2) continue;

    // icons (SVG drawn with the text colour): 3:1
    if (el.tagName.toLowerCase() === "svg") {
      const c = parse(cs.color);
      if (c && el.closest("button, a, .app-ico, .app-go")) test(el, [c], backgroundsOf(win, el.parentElement), 3, "icon");
      continue;
    }
    const hasText = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim().length);
    if (hasText) {
      const colors = textColorsOf(win, el);
      if (colors.length) {
        const size = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight, 10) >= 700;
        const large = size >= 24 || (size >= 18.66 && bold);
        test(el, colors, backgroundsOf(win, el), large ? 3 : 4.5, large ? "large text" : "text");
      }
    }
    if (el.tagName === "INPUT" && el.placeholder) {
      const ph = parse(win.getComputedStyle(el, "::placeholder").color);
      if (ph) test(el, [ph], backgroundsOf(win, el), 4.5, "placeholder");
    }
  }
  return { checked, min, fails };
}

// The page's colour once its stylesheet and theme script have settled (up to 2 s): the offline page has no content-ready marker.
async function settledBg(win, doc, want) {
  for (let i = 0; i < 40; i++) { if (win.getComputedStyle(doc.body).backgroundColor === want) break; await sleep(50); }
  return win.getComputedStyle(doc.body).backgroundColor;
}
// One navigation. test/theme-scheme.mjs sets prefers-color-scheme on this browser page before the test
// document is opened, so a portal page's head script sees that preference the first time it asks.
async function openThemed(url, want) {
  const page = await openPage(url);
  page.bg = await settledBg(page.win, page.doc, want);
  page.loads = page.win.performance.getEntriesByType("navigation").length;
  return page;
}
async function openPage(url, theme) {
  const f = document.createElement("iframe");
  f.style.cssText = "width:1280px;height:900px;border:0";
  document.getElementById("frames").append(f);
  f.src = "/" + url;
  const ready = () => { try { const w = f.contentWindow; return w.location.href !== "about:blank" && (w.document.documentElement.classList.contains("content-ready") || (url === "offline.html" && w.document.readyState === "complete")); } catch (e) { return false; } };
  for (let i = 0; i < 200 && !ready(); i++) await sleep(50);
  const w = f.contentWindow;
  if (url === "portal/index.html") for (let i = 0; i < 100 && !(w.document.querySelector("#app-grid .approw") || (w.document.getElementById("no-group") && !w.document.getElementById("no-group").hidden)); i++) await sleep(50);
  if (url.startsWith("portal/")) for (let i = 0; i < 100 && !w.document.querySelector("#shell-bar [aria-label=Theme]"); i++) await sleep(50);
  await sleep(300);
  return { frame: f, win: w, doc: w.document };
}

const THEMED_PAGES = ["offline.html"];
const SITE_PAGES = ["index.html", "about.html", "mentor.html", "member.html", "robots.html", "robot.html?year=2025", "robot.html?year=2022", "sponsors.html", "outreach.html", "media.html", "resources.html", "contact.html", "privacy.html", "terms.html"];

(async () => {
  if (MODE === "contrast" || MODE === "nogroup") {
    const pages = MODE === "nogroup" ? ["portal/index.html"] : [...SITE_PAGES, ...THEMED_PAGES, "portal/index.html", "portal/install.html"];
    const PAGE_BG = "rgb(16, 24, 39)";   // --ink on the public site
    for (const url of pages) {
      const { frame, win, doc } = await openPage(url);
      // the install banner sits over the portal home: show it (iPhone steps and the Install/link variants) and check it too
      if (url === "portal/index.html" && MODE === "contrast" && win.showInstallBanner) {
        win.showInstallBanner({ force: true });
        report(!!doc.querySelector(".install-banner"), `${url}: install banner can be shown over the page`);
      }
      if (SITE_PAGES.includes(url)) {
        // Public pages are dark only: whatever is saved or asked for, the page is Midnight & brass.
        const html = doc.documentElement;
        report(html.getAttribute("data-site") === "public" && win.getComputedStyle(html).colorScheme === "dark", `${url}: color-scheme is dark from the stylesheet and the page`, win.getComputedStyle(html).colorScheme);
        for (const [what, force] of [["as loaded", () => {}], ["with data-theme=light forced on <html>", () => { html.dataset.theme = "light"; html.classList.add("light"); html.classList.remove("dark"); }]]) {
          force(); await sleep(120);
          const bg = win.getComputedStyle(doc.body).backgroundColor;
          report(bg === PAGE_BG, `${url}: ${what}: the page is the dark ink colour`, bg);
          const r = contrastOf(win, doc);
          report(r.fails.length === 0, `${url}: ${what}: WCAG AA text contrast (${r.checked} items, lowest ${r.min.toFixed(2)}:1)`, r.fails.slice(0, 6).join(" | "));
        }
        const inputProbe = doc.createElement("input"); doc.body.append(inputProbe);
        report(win.getComputedStyle(inputProbe).colorScheme === "dark", `${url}: native form controls are dark`, win.getComputedStyle(inputProbe).colorScheme);
        inputProbe.remove();
        report(!doc.querySelector(".theme-switch"), `${url}: no theme switch`);
        report(![...doc.querySelectorAll("body *")].some((el) => win.getComputedStyle(el).opacity === "0" && !el.closest("[aria-hidden='true'], [hidden], .vh")), `${url}: nothing is at opacity 0 at rest`);
      } else {
      for (const theme of ["light", "dark"]) {
        // As the shell kit's applyTheme does (portal pages): data-theme, the dark/light class and color-scheme.
        const html = doc.documentElement;
        html.dataset.theme = theme;
        html.classList.toggle("dark", theme === "dark"); html.classList.toggle("light", theme === "light");
        html.style.colorScheme = theme;
        await sleep(120);
        const bg = win.getComputedStyle(doc.body).backgroundColor;
        report(theme === "light" ? bg === "rgb(247, 248, 250)" : bg === "rgb(7, 9, 15)", `${url}: ${theme} theme paints the ${theme} page colour`, bg);
        const r = contrastOf(win, doc);
        report(r.fails.length === 0, `${url}: ${theme}: WCAG AA text contrast (${r.checked} items, lowest ${r.min.toFixed(2)}:1)`, r.fails.slice(0, 6).join(" | "));
      }
      }
      // the portal's switch is the shared app bar's (D101): a cookie for every subdomain (D92), plus the old key
      if (url === "portal/index.html") {
        const [system, light, dark] = [...doc.querySelectorAll("#shell-bar [aria-label=Theme] .shbar-choice")];
        const cookie = () => (doc.cookie.match(/(?:^|;\s*)theme=([^;]*)/) || [])[1] || null;
        report(!!light && !!dark && !!system && doc.querySelector("#shell-bar [aria-label=Theme]").closest("[hidden]") !== null, `${url}: the app bar has the Light / Dark / Match my device choices, closed by default`);
        const cookieIs = (v) => cookie() === v;
        if (light && dark && system) {
          doc.querySelector("#shell-bar .shbar-acct").click();
          dark.click(); await sleep(80);
          report(doc.documentElement.dataset.theme === "dark" && cookieIs("dark") && win.localStorage.getItem("theme") === "dark" && dark.getAttribute("aria-pressed") === "true", `${url}: Dark sets the theme, the theme cookie and the old key`);
          doc.querySelector("#shell-bar .shbar-acct").click();
          light.click(); await sleep(80);
          report(doc.documentElement.dataset.theme === "light" && cookieIs("light") && light.getAttribute("aria-pressed") === "true" && dark.getAttribute("aria-pressed") === "false", `${url}: Light replaces it and moves the pressed state`);
          doc.querySelector("#shell-bar .shbar-acct").click();
          system.click(); await sleep(80);
          report(doc.documentElement.dataset.theme === undefined && cookie() === null && win.localStorage.getItem("theme") === null && system.getAttribute("aria-pressed") === "true", `${url}: Match my device clears the cookie and the old key`);
        }
      }
      frame.remove();
    }
    // focus ring (a UI component: 3:1 against every surface it can sit on)
    {
      const { frame, win, doc } = await openPage("index.html");
      const probe = doc.createElement("i"); probe.style.cssText = "color:var(--accent);background:var(--ink)"; doc.body.append(probe);
      const accent = parse(win.getComputedStyle(probe).color);
      for (const surface of ["--ink", "--ink-2", "--ink-3"]) {
        probe.style.background = `var(${surface})`;
        const bg = parse(win.getComputedStyle(probe).backgroundColor);
        report(ratio(accent, bg) >= 3, `public: focus ring (--accent) is at least 3:1 on ${surface}`, `${ratio(accent, bg).toFixed(2)}:1`);
      }
      probe.remove();
      frame.remove();
    }
    {
      const { frame, win, doc } = await openPage("portal/install.html");
      for (const theme of ["light", "dark"]) {
        // as the kit's applyTheme does: the head script set an inline color-scheme, which data-theme alone can't beat
        const html = doc.documentElement;
        html.dataset.theme = theme; html.classList.toggle("dark", theme === "dark"); html.classList.toggle("light", theme === "light");
        html.style.colorScheme = theme; await sleep(80);
        const pageBg = win.getComputedStyle(doc.body).backgroundColor;
        report(pageBg === (theme === "light" ? "rgb(247, 248, 250)" : "rgb(7, 9, 15)"), `${theme}: portal focus-ring page really is in the ${theme} theme`, pageBg);
        const probe = doc.createElement("i"); probe.style.cssText = "color:var(--accent);background:var(--ink)"; doc.body.append(probe);
        const accent = parse(win.getComputedStyle(probe).color);
        for (const surface of ["--ink", "--ink-2", "--ink-3"]) {
          probe.style.background = `var(${surface})`;
          const bg = parse(win.getComputedStyle(probe).backgroundColor);
          report(ratio(accent, bg) >= 3, `${theme}: portal focus ring (--accent) is at least 3:1 on ${surface}`, `${ratio(accent, bg).toFixed(2)}:1`);
        }
        probe.remove();
      }
      frame.remove();
    }
  }

  if (MODE === "system-light" || MODE === "system-dark") {
    const dark = MODE === "system-dark";
    const wantBg = dark ? "rgb(7, 9, 15)" : "rgb(247, 248, 250)";
    const clearCookie = () => { document.cookie = "theme=; Path=/; Max-Age=0"; };
    // 1) public pages: dark, whatever the system says, with nothing saved...
    localStorage.removeItem("theme"); clearCookie();
    let { frame, win, doc } = await openPage("index.html");
    report(win.matchMedia("(prefers-color-scheme: dark)").matches === dark, "Chrome is running with the " + (dark ? "dark" : "light") + " system setting");
    report(doc.documentElement.dataset.theme === undefined, "public page: does not set data-theme");
    report(win.getComputedStyle(doc.body).backgroundColor === "rgb(16, 24, 39)", `public page: stays dark under the ${dark ? "dark" : "light"} system setting`, win.getComputedStyle(doc.body).backgroundColor);
    const r = contrastOf(win, doc);
    report(r.fails.length === 0, `public page: contrast passes under the ${dark ? "dark" : "light"} system setting (${r.checked} items)`, r.fails.slice(0, 4).join(" | "));
    frame.remove();
    // 2) ...and with a saved light choice (cookie and old key): still dark, and the choice is left exactly as it was
    document.cookie = "theme=light; Path=/; Max-Age=3600"; localStorage.setItem("theme", "light");
    for (const url of ["about.html", "robots.html", "contact.html"]) {
      ({ frame, win, doc } = await openPage(url));
      report(win.getComputedStyle(doc.body).backgroundColor === "rgb(16, 24, 39)" && doc.documentElement.dataset.theme === undefined, `${url}: a saved light choice does not change the public page`, win.getComputedStyle(doc.body).backgroundColor);
      frame.remove();
    }
    report(/(?:^|;\s*)theme=light(?:;|$)/.test(document.cookie) && localStorage.getItem("theme") === "light", "public pages did not delete or rewrite the saved theme cookie or the old key", document.cookie);
    localStorage.removeItem("theme"); clearCookie();
    // 3) themed pages (the portal's install page, which has the shell kit's app bar) still follow the system, and a saved choice beats it
    let bg, loads;
    ({ frame, win, doc, bg, loads } = await openThemed("portal/install.html", wantBg));
    report(loads === 1 && doc.documentElement.dataset.theme === undefined && bg === wantBg, `portal install page (themed): follows the ${dark ? "dark" : "light"} system setting on the first load`, `${loads} load(s), ${bg} data-theme=${doc.documentElement.dataset.theme}`);
    frame.remove();
    localStorage.setItem("theme", dark ? "light" : "dark");
    const saved = dark ? "rgb(247, 248, 250)" : "rgb(7, 9, 15)";
    ({ frame, win, doc, bg, loads } = await openThemed("portal/install.html", saved));
    report(loads === 1 && doc.documentElement.dataset.theme === (dark ? "light" : "dark") && bg === saved, "portal install page (themed): a saved choice overrides the system setting on the first load", `${loads} load(s), ${bg}`);
    frame.remove();
    clearCookie(); localStorage.setItem("theme", "purple");
    ({ frame, win, doc, bg, loads } = await openThemed("portal/install.html", wantBg));
    report(loads === 1 && doc.documentElement.dataset.theme === undefined && bg === wantBg, "portal install page (themed): an unknown saved value is ignored on the first load", `${loads} load(s), data-theme=${doc.documentElement.dataset.theme} bg=${bg}`);
    frame.remove();
    localStorage.removeItem("theme"); clearCookie();
  }

  report(failures === 0, `ALL CHECKS (${failures} failures)`);
  const done = document.createElement("div");
  done.id = "done";
  done.textContent = failures === 0 ? "THEME-TEST-PASS" : "THEME-TEST-FAIL";
  document.body.append(done);
})();
</script>
</body>
</html>
