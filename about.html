<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>About Us</h1>
  <p>Who we are, what FIRST Robotics is, and how we got here.</p>
</div>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title" id="school-title"></h2>
    <p class="section-lead" id="school-body"></p>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title" id="first-title"></h2>
    <p class="section-lead" id="first-body"></p>
  </div>
</section>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title">Our Mission</h2>
    <p class="section-lead" id="mission-body"></p>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Our Values</h2>
    <div class="mechanism-grid" id="values-grid"></div>
  </div>
</section>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title">How We Work</h2>
    <div class="mechanism-grid" id="strategy-grid"></div>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Our History</h2>
    <p class="section-lead">Team 2972 has competed every season since 2009. See every robot on the
    <a href="robots.html">robots page</a>.</p>
    <div id="history"></div>
  </div>
</section>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title">Our Year</h2>
    <ul class="schedule-list" id="annual-list"></ul>
    <h3 class="subsection-title">2027 Competition Schedule</h3>
    <ul class="schedule-list" id="schedule-list"></ul>
    <div class="btn-row"><a class="btn btn-outline" id="calendar-link" target="_blank" rel="noopener">Team calendar</a></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  // Sets an element's text (or Markdown-subset text) from a content field and tags it with data-ck.
  const put = (id, path, value, isRich) => {
    const el = document.getElementById(id);
    el.setAttribute("data-ck", path);
    if (isRich) { el.setAttribute("data-ck-type", "rich"); el.innerHTML = rich(value); }
    else el.textContent = value;
  };
  put("school-title", "ABOUT_SCHOOL.heading", ABOUT_SCHOOL.heading);
  put("school-body", "ABOUT_SCHOOL.body", ABOUT_SCHOOL.body, true);
  put("first-title", "ABOUT_FIRST.heading", ABOUT_FIRST.heading);
  put("first-body", "ABOUT_FIRST.body", ABOUT_FIRST.body, true);
  put("mission-body", "SITE.mission", SITE.mission);

  const cards = (name, items) => items.map((v, i) => `<div class="mechanism"${ck(`${name}[${i}]`)}><h3${ck(`${name}[${i}].name`)}>${esc(v.name)}</h3><p${ck(`${name}[${i}].text`, "rich")}>${rich(v.text)}</p></div>`).join("");
  const values = document.getElementById("values-grid");
  values.setAttribute("data-ck", "VALUES");
  values.innerHTML = cards("VALUES", VALUES);
  const strategy = document.getElementById("strategy-grid");
  strategy.setAttribute("data-ck", "STRATEGY");
  strategy.innerHTML = cards("STRATEGY", STRATEGY);

  const t = HISTORY.today;
  document.getElementById("history").innerHTML = `
    <ol class="timeline"${ck("HISTORY.milestones")}>
      ${HISTORY.milestones.map((m, i) => `
        <li${ck(`HISTORY.milestones[${i}]`)}>
          <span class="timeline-year"${ck(`HISTORY.milestones[${i}].year`)}>${esc(m.year)}</span>
          <div class="timeline-body">
            <ul${ck(`HISTORY.milestones[${i}].items`)}>${m.items.map((it, j) => `<li${ck(`HISTORY.milestones[${i}].items[${j}].text`, "rich")}>${rich(it.text)}</li>`).join("")}</ul>
            ${m.image ? `<img${imgAttrs(m.image, 600)}${ck(`HISTORY.milestones[${i}].image`)}${ckAlt(`HISTORY.milestones[${i}].imageAlt`)} alt="${esc(altFor(m.image, m.imageAlt || m.year))}" loading="lazy" />` : ""}
          </div>
        </li>`).join("")}
    </ol>
    <article class="history-era${t.image ? "" : " no-image"}"${ck("HISTORY.today")}>
      <div>
        <h3${ck("HISTORY.today.heading")}>${esc(t.heading)}</h3>
        <div${ck("HISTORY.today.paragraphs")}>
          ${t.paragraphs.map((p, j) => `<p${ck(`HISTORY.today.paragraphs[${j}]`, "rich")}>${rich(p)}</p>`).join("")}
        </div>
      </div>
      ${t.image ? `<img${imgAttrs(t.image, 800)}${ck("HISTORY.today.image")}${ckAlt("HISTORY.today.imageAlt")} alt="${esc(altFor(t.image, t.imageAlt || t.heading))}" loading="lazy" />` : ""}
    </article>`;

  const annual = document.getElementById("annual-list");
  annual.setAttribute("data-ck", "ANNUAL_EVENTS");
  annual.innerHTML = ANNUAL_EVENTS.map((e, i) => `
    <li${ck(`ANNUAL_EVENTS[${i}]`)}>
      <span class="event-name"${ck(`ANNUAL_EVENTS[${i}].name`)}>${esc(e.name)}</span>
      <span class="event-loc"><span${ck(`ANNUAL_EVENTS[${i}].when`)}>${esc(e.when)}</span> · <span${ck(`ANNUAL_EVENTS[${i}].description`)}>${esc(e.description)}</span></span>
    </li>
  `).join("");

  const schedule = document.getElementById("schedule-list");
  schedule.setAttribute("data-ck", "SCHEDULE_2027");
  schedule.innerHTML = SCHEDULE_2027.map((s, i) => `
    <li${ck(`SCHEDULE_2027[${i}]`)}>
      <span class="event-name"${ck(`SCHEDULE_2027[${i}].event`)}>${esc(s.event)}</span>
      <span class="event-loc"><span${ck(`SCHEDULE_2027[${i}].dates`)}>${esc(s.dates)}</span> · <span${ck(`SCHEDULE_2027[${i}].location`)}>${esc(s.location)}</span></span>
    </li>
  `).join("");

  const cal = document.getElementById("calendar-link");
  cal.href = safeUrl(contentGet("TEAM_CALENDAR_URL"));
  cal.setAttribute("data-ck-href", "TEAM_CALENDAR_URL");
});
</script>
</body>
</html>
