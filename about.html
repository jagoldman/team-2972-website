<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="about-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// A closed <details> with the whole paragraph: the page opens with little text and keeps the full wording one click away.
function disclosure(o, name, summaryId, bodyId) {
  return `<details class="disc"${ck(name)}><summary id="${summaryId}"${ck(`${name}.heading`)}>${esc(o.heading)}</summary><p id="${bodyId}"${ck(`${name}.body`, "rich")}>${rich(o.body)}</p></details>`;
}

// Photos for the milestones that have one come from the content (HISTORY.milestones[].image).
function timeline() {
  const rows = HISTORY.milestones.map((m, i) => ({ m, i, items: (m.items || []).map((it, j) => ({ it, j })).filter(({ it }) => it.kind === "team") })).filter((x) => x.items.length);
  return `<div class="tl" id="history"${ck("HISTORY.milestones")}>${rows.map(({ m, i, items }) => `
    <div class="tl-row timeline-item"${ck(`HISTORY.milestones[${i}]`)}>
      <div class="tl-side"><div class="tl-mark" aria-hidden="true"><i></i></div><h3 class="tl-t tl-t-d"${ck(`HISTORY.milestones[${i}].year`)}>${esc(m.year)}</h3></div>
      <div class="tl-body timeline-body"><h3 class="tl-t tl-t-m"${ck(`HISTORY.milestones[${i}].year`)}>${esc(m.year)}</h3>
        <div${ck(`HISTORY.milestones[${i}].items`)}>${items.map(({ it, j }) => `<div class="tl-item"><p${ck(`HISTORY.milestones[${i}].items[${j}].text`, "rich")}>${rich(it.text)}</p></div>`).join("")}</div>
        ${m.image ? `<div class="photo r43 tl-photo"><img${imgAttrs(m.image, 600)}${ck(`HISTORY.milestones[${i}].image`)}${ckAlt(`HISTORY.milestones[${i}].imageAlt`)} alt="${esc(altFor(m.image, m.imageAlt || m.year))}" loading="lazy" width="900" height="675" /></div>` : ""}
      </div>
    </div>`).join("")}<div class="tl-track" aria-hidden="true"><i class="tl-fill"></i></div></div>`;
}

onContent(() => {
  const wins = [];
  ROBOTS.slice().sort((a, b) => Number(a.year) - Number(b.year)).forEach((r) => (r.results || []).forEach((x) => { if (resultType(x.result) === "win") wins.push(`${x.event} ${r.year}`); }));
  // The team sheet: six rows. "Seasons played" and "Event wins" are counted from ROBOTS, the rest are fields.
  const sheet = [
    ["Team", `FRC <span${ck("SITE.teamNumber")}>${esc(SITE.teamNumber)}</span>, <span${ck("SITE.teamName")}>${esc(SITE.teamName)}</span>`],
    ["School", `<span${ck("SITE.school")}>${esc(SITE.school)}</span>`],
    ["Home", `<span${ck("SITE.location")}>${esc(SITE.location)}</span>`],
    ["Founded", `<span${ck("SITE.founded")}>${esc(SITE.founded)}</span>`],
    ["Seasons played", esc(String(ROBOTS.length))],
    ["Event wins", wins.length ? esc(wins.join(" · ")) : "None yet"],
  ];
  const href = safeUrl(SITE.schoolUrl);
  document.getElementById("about-page").innerHTML = `
    <section class="band"><div class="wrap">
      <h1 class="h1" tabindex="-1">About the team</h1><p class="lead"${ck("SITE.mission")}>${esc(SITE.mission)}</p>
      <div class="grid2 top spaced"><dl class="sheet tab">${sheet.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
        <div class="school-box">${schoolMark("lg")}<p${ck("ABOUT_SCHOOL.body", "rich")}>${esc(firstSentence(ABOUT_SCHOOL.body))}</p>${href ? `<p class="flush"><a href="${esc(href)}" target="_blank" rel="noopener"${ckHref("SITE.schoolUrl")}>Visit Dawson School ↗</a></p>` : ""}</div></div>
      <div class="disc-row spaced">${disclosure(ABOUT_FIRST, "ABOUT_FIRST", "first-title", "first-body")}${disclosure(ABOUT_SCHOOL, "ABOUT_SCHOOL", "school-title", "school-body")}</div>
    </div></section>
    <section class="band alt"><div class="wrap"><h2 class="h2">What we value</h2><div class="vgrid"${ck("VALUES")}>${VALUES.map((v, i) => `<div${ck(`VALUES[${i}]`)}><b${ck(`VALUES[${i}].name`)}>${esc(v.name)}</b><span${ck(`VALUES[${i}].text`, "rich")}>${rich(v.text)}</span></div>`).join("")}</div></div></section>
    <section class="band"><div class="wrap"><h2 class="h2">How we work</h2><div class="vgrid"${ck("STRATEGY")}>${STRATEGY.map((v, i) => `<div${ck(`STRATEGY[${i}]`)}><b${ck(`STRATEGY[${i}].name`)}>${esc(v.name)}</b><span${ck(`STRATEGY[${i}].text`, "rich")}>${rich(v.text)}</span></div>`).join("")}</div></div></section>
    <section class="band alt"><div class="wrap"><h2 class="h2">How the team grew</h2>${timeline()}
      <p class="spaced-sm"><a class="tl-link" href="robots.html">Competition results are on the Robots page →</a></p>
      <p class="tl-links"><a class="tl-link" href="outreach.html">Outreach →</a><a class="tl-link" href="media.html">Media →</a></p></div></section>`;
  initTimeline();
});
</script>
</body>
</html>
