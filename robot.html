<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robot | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="robot-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// One template for every season: robot.html?year=2025
onContent(() => {
  const page = document.getElementById("robot-page");
  const year = new URLSearchParams(window.location.search).get("year");
  const index = ROBOTS.findIndex((r) => r.year === year);

  if (index === -1) {
    document.title = `Robot not found | Team ${SITE.teamNumber}`;
    // The year comes from the address bar, so it is escaped wherever it is put into HTML.
    page.innerHTML = `
      <section class="band"><div class="wrap">
        <h1 class="h1" tabindex="-1">Robot not found</h1>
        <p class="lead">${year ? `We don't have a page for ${esc(year)} yet.` : "No season was picked."}</p>
        <div class="btns"><a class="btn btn-gold" href="robots.html">See all robots</a></div>
      </div></section>`;
    return;
  }

  const r = ROBOTS[index];
  const newer = ROBOTS[index - 1];
  const older = ROBOTS[index + 1];
  document.title = `${r.year} ${r.name || r.game} | Team ${SITE.teamNumber}`;
  const P = (field) => `ROBOTS[${index}].${field}`;   // the data-ck path of one of this robot's fields
  const list = (x) => Array.isArray(x) ? x : [];
  const section = (title, body) => body ? `<section class="sec"><h2>${title}</h2>${body}</section>` : "";
  const watch = (url, label, path) => `<a href="${esc(safeUrl(url))}" target="_blank" rel="noopener"${ckHref(path)}>${label} ↗</a>`;

  // Header: photo beside the name, year, game and the season line. A season with no photo has the text alone.
  const photo = r.image ? `
    <figure><div class="photo r43"><img id="robot-photo"${imgAttrs(r.image, 1200)}${imgPos(r)}${ck(P("image"))} alt="${esc(altFor(r.image, `${robotName(r)}, the ${r.year} robot`))}" width="1000" height="750"></div>
      ${r.photoSource ? `<figcaption${ck(P("photoSource"))}>${esc(r.photoSource)}</figcaption>` : ""}</figure>` : "";
  const hero = `
    <section class="band tight"><div class="wrap">
      <a class="crumb" href="robots.html">← All robots</a>
      <div class="${photo ? "grid2" : ""}">${photo}<div>
        <p class="label gold"><span${ck(P("year"))}>${esc(r.year)}</span> · <span${ck(P("game"))}>${esc(r.game)}</span></p>
        <h1 class="h1" tabindex="-1"${ck(P("name"))}>${esc(robotName(r))}</h1>
        ${r.tagline ? `<p class="lead"${ck(P("tagline"))}>${esc(r.tagline)}</p>` : ""}
        ${r.stats ? `<p class="tab"${ck(P("stats"))}>${esc(r.stats)}</p>` : ""}
        <div class="rhead-meta">${list(r.awards).length ? `<span class="metas"${ck(P("awards"))}>${r.awards.map((a, i) => `<span class="pill"${ck(P(`awards[${i}]`))}>${esc(a)}</span>`).join("")}</span>` : ""}${r.status ? `<span class="chip"${ck(P("status"))}>${esc(r.status)}</span>` : ""}</div>
      </div></div>
    </div></section>`;

  const results = list(r.results).length ? resultsTable(r, `ROBOTS[${index}]`) : "";
  const gameVideo = isSet(r.gameVideo) && youtubeEmbed(r.gameVideo) ? `<p>${watch(r.gameVideo, "Watch the game animation on YouTube", P("gameVideo"))}</p>` : "";
  const game = (r.gameSummary || gameVideo) ? `${r.gameSummary ? `<p${ck(P("gameSummary"), "rich")}>${rich(r.gameSummary)}</p>` : ""}${gameVideo}` : "";
  const about = r.description ? `<p${ck(P("description"), "rich")}>${rich(r.description)}</p>` : "";
  const specs = list(r.specs).length ? `<dl class="specs"${ck(P("specs"))}>${r.specs.map((s, i) => `<div${ck(P(`specs[${i}]`))}><dt${ck(P(`specs[${i}].label`))}>${esc(s.label)}</dt><dd${ck(P(`specs[${i}].value`))}>${esc(s.value)}</dd></div>`).join("")}</dl>` : "";
  const mechanisms = list(r.mechanisms).length ? `<div class="mech"${ck(P("mechanisms"))}>${r.mechanisms.map((m, i) => `<div${ck(P(`mechanisms[${i}]`))}><h3${ck(P(`mechanisms[${i}].name`))}>${esc(m.name)}</h3><p${ck(P(`mechanisms[${i}].text`), "rich")}>${rich(m.text)}</p></div>`).join("")}</div>` : "";
  const gallery = list(r.gallery).length ? `<div class="gallery-grid"${ck(P("gallery"))}>${r.gallery.map((src, i) => `<a href="${esc(imgUrl(src, 2000))}" target="_blank" rel="noopener"><img${imgAttrs(src, 600)}${ck(P(`gallery[${i}]`))} alt="${esc(altFor(src, `${robotName(r)} (${r.year})`))}" loading="lazy" /></a>`).join("")}</div>` : "";

  // Videos and links: each list keeps its own key so the editor can add to it. YouTube opens on YouTube (nothing is embedded).
  const group = (base, items, text) => items.length ? `<ul class="links"${ck(P(base))}>${items.map((v, i) => `<li>${text(v, i)}</li>`).join("")}</ul>` : "";
  const videos = group("videos", list(r.videos).filter((v) => youtubeEmbed(v)), (v, k) => watch(v, `${list(r.videos).length > 1 ? `Season video ${k + 1}` : "Season video"}, watch on YouTube`, P(`videos[${list(r.videos).indexOf(v)}]`)));
  const matches = group("matchVideos", list(r.matchVideos), (v, i) => `<a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener"${ck(P(`matchVideos[${i}]`))}${ckHref(P(`matchVideos[${i}].url`))}>Match video: <span${ck(P(`matchVideos[${i}].label`))}>${esc(v.label)}</span> ↗</a>`);
  const named = (base) => group(base, list(r[base]), (v, i) => `<a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener"${ck(P(`${base}[${i}]`))}${ckHref(P(`${base}[${i}].url`))}><span${ck(P(`${base}[${i}].label`))}>${esc(v.label)}</span> ↗</a>`);
  const single = (path, url, label) => isSet(url) ? `<ul class="links"><li>${watch(url, label, path)}</li></ul>` : "";
  const links = single(P("reveal"), r.reveal, "Robot reveal on YouTube") + videos + matches + single(P("binder"), r.binder, "Technical binder") + named("buildBlog") + named("links") +
    `<ul class="links"><li><a href="${esc(tbaTeamYear(r.year))}" target="_blank" rel="noopener" data-ck-ignore>Season on The Blue Alliance ↗</a></li></ul>`;

  // Seasons with little on record ask alumni for help
  const ask = (!r.image || !r.name) ? `<div class="sec"><p>Were you on the team in ${esc(r.year)}? Send photos, the robot's name, or stories to</p>${emailAddress()}</div>` : "";

  // The neighbouring seasons show the same fields as their own pages: name if set, otherwise the game.
  const label = (n, i) => `<span${ck(`ROBOTS[${i}].year`)}>${esc(n.year)}</span> <span${ck(`ROBOTS[${i}].${n.name ? "name" : "game"}`)}>${esc(n.name || n.game)}</span>`;
  page.innerHTML = hero + `<div class="wrap tail">` +
    section("Results", results) + section("The game", game) + section("About the robot", about) + section("Specs", specs) + section("Mechanisms", mechanisms) +
    section("Photos", gallery) + section("Videos and links", links) + ask + `
    <nav class="pn" aria-label="Seasons"><span>${older ? `<a href="${robotUrl(older)}">← ${label(older, index + 1)}</a>` : ""}</span><span>${newer ? `<a href="${robotUrl(newer)}">${label(newer, index - 1)} →</a>` : ""}</span></nav></div>`;
});
</script>
</body>
</html>
