<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outreach | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="outreach-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  const cards = OUTREACH_EVENTS.map((e, i) => `
    <article class="card"${ck(`OUTREACH_EVENTS[${i}]`)}>
      <div class="photo r32"><img${imgAttrs(e.image, 800)}${ck(`OUTREACH_EVENTS[${i}].image`)}${ckAlt(`OUTREACH_EVENTS[${i}].name`)} alt="${esc(altFor(e.image, e.name + ", Team " + SITE.teamNumber + " outreach"))}" loading="lazy" width="800" height="534" /></div>
      <div class="card-b">
        <p class="label"${ck(`OUTREACH_EVENTS[${i}].date`)}>${esc(e.date)}</p>
        <h2 class="h3"${ck(`OUTREACH_EVENTS[${i}].name`)}>${esc(e.name)}</h2>
        <p${ck(`OUTREACH_EVENTS[${i}].description`, "rich")}>${rich(e.description)}</p>
      </div>
    </article>`).join("");
  document.getElementById("outreach-page").innerHTML = `
    <section class="band"><div class="wrap"><h1 class="h1" tabindex="-1">Outreach</h1><p class="lead">How we give back to the FIRST and Dawson community.</p>
      <p>From mentoring FIRST LEGO League teams to running STEM demos, we try to pass on what FIRST has given us.</p>
      <div class="cards-2" id="outreach-grid"${ck("OUTREACH_EVENTS")}>${OUTREACH_EVENTS.length ? cards : `<p class="empty-note">Event write-ups coming soon. Check back for updates on our latest outreach.</p>`}</div></div></section>
    <section class="band alt"><div class="wrap"><h2 class="h2">Dawson FLL</h2><p>Team 2972 supports Dawson School's FIRST LEGO League program, mentoring younger students as they take their first steps in robotics.</p></div></section>`;
});
</script>
</body>
</html>
