<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team 2972 Redesign Demo</title>
<meta name="theme-color" content="#101827">
<style>
@font-face { font-family: "Inter"; src: url("fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root {
  --ink: #101827; --ink-2: #152033; --ink-3: #1c293b;
  --line: rgba(243, 245, 250, 0.09); --line-2: rgba(243, 245, 250, 0.18);
  --hover: rgba(243, 245, 250, 0.06); --hover-2: rgba(243, 245, 250, 0.08);
  --text: #f3f5fa; --text-2: #c5cfdd; --mute: #b4c0d1; --ph-num: #b4c0d1;
  --gold: #e6b849; --gold-2: #f2cd74; --on-gold: #101827;
  --accent: #e6b849; --accent-2: #f2cd74;
  --tint: rgba(230, 184, 73, 0.1); --tint-line: rgba(230, 184, 73, 0.35);
  color-scheme: dark;
}
:root {
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gl: max(clamp(16px, 4vw, 48px), env(safe-area-inset-left, 0px));
  --gr: max(clamp(16px, 4vw, 48px), env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font); font-size: 1.0625rem; line-height: 1.6; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
img { display: block; max-width: 100%; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1:focus { outline: none; }
p { margin: 0 0 16px; max-width: 65ch; }
ul, ol, dl { margin: 0; padding: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap { width: 100%; max-width: calc(1200px + var(--gl) + var(--gr)); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 400px) { .wrap { padding-left: var(--gl); padding-right: var(--gr); } }
.band { padding-block: clamp(40px, 6vw, 80px); }
.band.alt { background: var(--ink-2); }
.band.tight { padding-block: clamp(24px, 3.4vw, 48px); }
.band.rules { border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }

.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); margin: 0 0 8px; }
.label.gold { color: var(--accent); }
.h1 { font-weight: 800; font-size: clamp(2.2rem, 4.6vw, 3.6rem); letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 16px; }
.h2 { font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.3rem); letter-spacing: -0.025em; line-height: 1.12; margin: 0 0 12px; }
.h3 { font-weight: 700; font-size: 1.3rem; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px; }
.lead { font-size: 1.15rem; color: var(--text-2); }
.mute { color: var(--mute); }
.small { font-size: 0.875rem; }
.tab { font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; border-radius: 999px; font: 600 1rem/1 var(--font); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-gold { background: var(--gold); color: var(--on-gold); }
.btn-line { background: transparent; color: var(--text); border-color: var(--line-2); }
.btn-sm { min-height: 44px; padding: 0 16px; font-size: 0.9rem; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }
.tl-link { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; color: var(--accent); text-decoration: none; }
.tl-link:hover { text-decoration: underline; }
.addr { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.addr-t { font-weight: 600; color: var(--text); user-select: all; overflow-wrap: anywhere; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-size: 0.78rem; font-weight: 600; line-height: 1.4; }
.chip { display: inline-block; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); font-size: 0.78rem; font-weight: 600; line-height: 1.4; }

.demo-strip { background: var(--ink-2); border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--mute); padding-block: 6px; }
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); border-bottom: 1px solid var(--line); }
.hd { display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; min-height: 64px; }
.school-d { display: inline-flex; align-items: center; min-height: 44px; flex: none; }
.school-d img { height: 34px; width: auto; }
.vr { width: 1px; height: 28px; background: var(--line-2); flex: none; }
[hidden] { display: none !important; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); min-height: 44px; padding-block: 8px; }
.brand img { border-radius: 50%; }
.brand-t { display: flex; flex-direction: column; line-height: 1.1; }
.brand-t b { font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: var(--accent); letter-spacing: -0.02em; }
.brand-t span { font-size: 0.78rem; color: var(--text-2); }
.menu-btn { display: none; margin-left: auto; min-height: 44px; padding: 0 18px; border-radius: 999px; background: transparent; border: 1px solid var(--line-2); color: var(--text); font: 600 0.95rem var(--font); cursor: pointer; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.nav a.nl { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; border-radius: 999px; color: var(--text-2); text-decoration: none; font-weight: 500; }
.nav a.nl:hover { background: var(--hover); color: var(--text); }
.nav a.nl[aria-current="page"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.nav a.btn { margin-left: 6px; padding: 0 18px; }
@media (max-width: 1000px) {
  .hd { gap: 0 10px; }
  .brand { gap: 8px; }
  .menu-btn { display: inline-flex; align-items: center; }
  .nav { display: none; flex-direction: column; align-items: stretch; width: 100%; margin: 0; padding-bottom: 16px; }
  .site-header.open .nav { display: flex; }
  .nav a.nl { border-radius: 0; border-top: 1px solid var(--line); }
  .nav a.btn { margin: 12px 0 0; }
}

.hero-grid { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
.hero h1 { font-weight: 800; font-size: clamp(2.4rem, 5.2vw, 4.6rem); letter-spacing: -0.04em; line-height: 1; margin: 0 0 20px; }
.photo { border-radius: 14px; overflow: hidden; background: var(--ink-3); border: 1px solid var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.r43 { aspect-ratio: 4 / 3; } .r32 { aspect-ratio: 3 / 2; } .r11 { aspect-ratio: 1 / 1; }
figure { margin: 0; }
figcaption { font-size: 0.85rem; color: var(--mute); margin-top: 8px; }

.next { display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(24px, 4vw, 56px); align-items: start; }
.next-name { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 3.6vw, 2.9rem); letter-spacing: -0.03em; line-height: 1.08; margin: 0 0 8px; text-wrap: balance; }
.countdown { font-family: var(--display); font-weight: 700; font-size: 1.3rem; color: var(--accent); margin: 12px 0 0; }
.later { list-style: none; }
.later li { padding: 12px 0; border-top: 1px solid var(--line); }
.later b { font-family: var(--display); font-size: 1.1rem; display: block; }

.sl-wrap { overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 24px; padding-top: 8px; }
.sl-grid { display: grid; grid-template-columns: repeat(18, minmax(56px, 1fr)); min-width: 1008px; }
.sl-col { display: flex; flex-direction: column; align-items: center; padding: 8px 2px; border-radius: 8px; color: var(--text); text-decoration: none; min-width: 0; }
a.sl-col:hover { background: var(--hover); }
.sl-marks { height: 112px; width: 100%; display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; border-bottom: 1px solid var(--line-2); padding-bottom: 8px; }
.sl-dash { color: var(--mute); }
.sl-year { font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums; margin-top: 8px; }
.sl-name { font-size: 0.7rem; color: var(--mute); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.2em; }
.m-gold { fill: var(--gold); stroke: var(--accent); stroke-width: 1; }
.m-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.m-out { fill: none; stroke: var(--accent); stroke-width: 2; }
.m-dot { fill: var(--accent); }
.m-grey { fill: none; stroke: var(--mute); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; list-style: none; margin-top: 16px; font-size: 0.875rem; color: var(--text-2); }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.sl-sum { color: var(--text-2); font-variant-numeric: tabular-nums; margin: 0; }

.names { display: flex; flex-wrap: wrap; gap: 12px 40px; list-style: none; margin: 16px 0 24px; font-family: var(--display); font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
.grid2.top { align-items: start; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.fchip { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--text); font: 600 0.95rem var(--font); cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
.card { display: flex; flex-direction: column; border: 1px solid var(--line-2); border-radius: 14px; overflow: hidden; background: var(--ink-3); color: var(--text); text-decoration: none; min-width: 0; }
.card .photo { border: 0; border-radius: 0; }
.card-b { padding: 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; align-items: flex-start; }
.card-b .label { margin: 0; }
.card-b p { color: var(--text-2); font-size: 0.95rem; margin: 0; }
.ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 100%; background: var(--ink-3); background-image: repeating-linear-gradient(135deg, transparent 0 10px, var(--line) 10px 11px); }
.ph b { font-family: var(--display); font-size: 3rem; font-weight: 800; color: var(--ph-num); line-height: 1; font-variant-numeric: tabular-nums; }
.ph span { font-size: 0.8rem; color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase; }
.archive { border-top: 1px solid var(--line-2); margin-top: 48px; padding-top: 32px; }

.sec { border-top: 1px solid var(--line); padding-block: 32px; }
.sec h2 { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 16px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { border-left: 3px solid transparent; }
tr.win td:first-child { border-left-color: var(--gold); }
.specs { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; }
.specs dt, .specs dd { margin: 0; padding: 12px 0; border-top: 1px solid var(--line); }
.specs dt { color: var(--mute); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding-right: 16px; }
.mech { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; }
.mech h3 { font-size: 1.05rem; margin-bottom: 4px; }
.mech p { color: var(--text-2); margin: 0; }
.links { list-style: none; }
.links li { border-top: 1px solid var(--line); }
.links a { display: flex; align-items: center; min-height: 44px; }
.pn { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line-2); padding-top: 24px; margin-top: 16px; }
.pn a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; }
.crumb { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; margin-bottom: 8px; }
.rhead-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

.dated { list-style: none; max-width: 760px; }
.dated li { display: grid; grid-template-columns: 4.5rem 1fr; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.dated b { font-family: var(--display); color: var(--accent); font-variant-numeric: tabular-nums; font-size: 1.1rem; }

.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0; }
.roles p { color: var(--text-2); margin: 0; font-size: 0.95rem; }
.roles h4 { font-size: 1rem; margin-bottom: 4px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; list-style: none; margin-top: 24px; }
.steps li { border-top: 2px solid var(--line-2); padding-top: 20px; position: relative; min-width: 0; }
.steps li::before { content: ""; position: absolute; top: -6px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.steps .step-d { color: var(--mute); font-size: 0.875rem; margin: 0; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 32px; margin-top: 16px; }
.vgrid div { border-top: 1px solid var(--line-2); padding: 12px 0 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vgrid b { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.vgrid span { color: var(--text-2); font-size: 0.875rem; }
.seg { display: inline-flex; max-width: 100%; padding: 4px; gap: 4px; border: 1px solid var(--line-2); border-radius: 999px; margin: 24px 0 28px; }
.segb { min-height: 44px; padding: 0 28px; border-radius: 999px; border: 0; background: transparent; color: var(--text); font: 600 1rem var(--font); cursor: pointer; }
.segb[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
.segb:not([aria-selected="true"]):hover { background: var(--hover); }
.sheet div { display: grid; grid-template-columns: 9rem 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); min-width: 0; }
.sheet div:last-child { border-bottom: 1px solid var(--line-2); }
.sheet dt { color: var(--mute); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.sheet dd { margin: 0; font-weight: 500; }
.school-box { border: 1px solid var(--line-2); border-radius: 14px; background: var(--ink-3); padding: 24px; }
.school-box .wm { margin-bottom: 16px; }
.wm { display: block; aspect-ratio: 414 / 157; max-width: 100%; background: var(--text); -webkit-mask: url("img/dawson-wordmark.png") left center / contain no-repeat; mask: url("img/dawson-wordmark.png") left center / contain no-repeat; }
.wm-a { display: inline-block; max-width: 100%; }
.school-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 28px; }
.school-line .label { margin: 0; }
.disc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 clamp(24px, 4vw, 56px); align-items: start; }
.disc { border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); margin-bottom: -1px; }
.disc summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 6px 0; cursor: pointer; list-style: none; font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.disc summary::-webkit-details-marker { display: none; }
.disc summary::after { content: "+"; font-size: 1.5rem; line-height: 1; color: var(--accent); }
.disc[open] summary::after { content: "\2013"; }
.disc summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.disc p { color: var(--text-2); margin: 0 0 16px; }
.hl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; max-width: none; margin-top: 8px; }

.site-footer { border-top: 1px solid var(--line-2); background: var(--ink-2); padding-block: clamp(32px, 5vw, 56px); }
.ft { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 32px; }
.ft ul { list-style: none; }
.ft li a { display: inline-flex; align-items: center; min-height: 44px; }
.ft p { color: var(--text-2); }

@media (max-width: 760px) {
  .hero-grid, .grid2, .next, .ft { grid-template-columns: 1fr; }
  .hero-grid .photo-col { order: -1; }
  .roles, .mech, .disc-row, .hl { grid-template-columns: 1fr; }
  .sheet div { grid-template-columns: 7.5rem 1fr; }
  .disc-row .disc + .disc { margin-top: 16px; }
  .steps { grid-template-columns: 1fr; gap: 0; }
  .steps li { border-top: 0; border-left: 2px solid var(--line-2); padding: 0 0 24px 20px; }
  .steps li::before { top: 4px; left: -6px; }
  .specs { grid-template-columns: 1fr; }
  .specs dt { padding-bottom: 0; border-bottom: 0; }
  .specs dd { border-top: 0; padding-top: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .card, .fchip, .sl-col, .nav a.nl, .tl-link { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
  .btn-gold:hover { background: var(--gold-2); }
  .btn-line:hover { background: var(--hover); }
  .card:hover { border-color: var(--accent); }
}
.btn-gold:hover { background: var(--gold-2); }
.btn-line:hover { background: var(--hover); }
.card:hover { border-color: var(--accent); }
.fchip:hover { background: var(--hover); }
.fchip[aria-pressed="true"]:hover { background: var(--gold-2); }

/* Border Beam — ported from Magic UI (registry/magicui/border-beam.tsx), colours swapped for tokens. Defaults: size 50, duration 6s, borderWidth 1, linear */
.next-card { position: relative; border: 1px solid var(--line-2); border-radius: 14px; background: var(--ink-3); padding: clamp(24px, 3vw, 32px); }
.beam { display: none; }

.stats { display: flex; flex-wrap: wrap; gap: 20px 0; list-style: none; margin: 0; }
.stats li { display: flex; flex-direction: column; padding: 0 clamp(20px, 3.5vw, 44px); border-left: 1px solid var(--line-2); }
.stats li:first-child { padding-left: 0; border-left: 0; }
.stat-n { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4.5vw, 3.4rem); line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
.count-big { margin: 12px 0 0; display: flex; flex-direction: column; }
.count-big .stat-n { color: var(--accent); }
@media (max-width: 520px) {
  .stats li, .stats li:first-child { padding: 0 24px 0 0; border-left: 0; }
}

/* Bento Grid — ported from Magic UI (registry/magicui/bento-grid.tsx): 3 cols, gap 1rem, card anatomy and hover wash; rows shortened to fit text and the link is always visible */
.bento { display: grid; width: 100%; grid-template-columns: 1fr; gap: 16px; margin-top: 24px; }
.bc { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; min-width: 0; border-radius: 12px; background: var(--ink-3); }
.bc-bg { position: relative; }
.bc-bg img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.bc-main { margin-top: auto; position: relative; }
.bc-body { display: flex; flex-direction: column; gap: 4px; padding: 16px 16px 4px; }
.bc-name { font-family: var(--display); font-size: 1.25rem; font-weight: 600; line-height: 1.75rem; color: var(--text); margin: 0; }
.bc-body p { max-width: 32rem; margin: 0; color: var(--text-2); font-size: 0.95rem; }
.bc-cta { display: flex; align-items: center; padding: 0 16px 8px; }
.bc-cta a { display: inline-flex; align-items: center; min-height: 44px; font-size: 0.875rem; font-weight: 500; color: var(--accent); text-underline-offset: 4px; text-decoration: none; }
.bc-cta a:hover, .bc-cta a:focus-visible { text-decoration: underline; }
.bc-cta a span { margin-left: 8px; }
.bc-wash { position: absolute; inset: 0; pointer-events: none; }
.bc .shop-chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 8px 0 0; }
@media (min-width: 1024px) {
  .bento { grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(13rem, auto); }
  .bc-stud { grid-row: span 2; }

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
function pl(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
function robotName(r) { return r.name || (r.year + " Robot"); }
function tbaTeamYear(y) { return "https://www.thebluealliance.com/team/" + SITE.teamNumber + "/" + y; }
function ext(url, text) { return "<a href=\"" + esc(url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(text) + "</a>"; }
function addr() { return "<span class=\"addr\"><span class=\"addr-t\">" + esc(SITE.email) + "</span><button type=\"button\" class=\"btn btn-line btn-sm\" data-copy>Copy</button></span>"; }
function mdLinks(text) {
  var re = /\[([^\]]+)\]\(robot\.html\?year=(\d{4})\)/g, out = "", last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index)) + "<a href=\"#robot-" + m[2] + "\">" + esc(m[1]) + "</a>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
var MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
function parseDates(s) {
  var m = /([A-Za-z]+)\.?\s+(\d{1,2})(?:\s*[-–—]\s*(?:([A-Za-z]+)\.?\s+)?(\d{1,2}))?\s*,?\s*(\d{4})/.exec(String(s || ""));
  if (!m) return null;
  var m1 = MONTHS[m[1].slice(0, 3).toLowerCase()];
  var m2 = m[3] ? MONTHS[m[3].slice(0, 3).toLowerCase()] : m1;
  if (m1 == null || m2 == null) return null;
  var y = +m[5];
  return { start: new Date(y, m1, +m[2]), end: new Date(y, m2, +(m[4] || m[2]), 23, 59, 59) };
}
function parseResult(res) {
  var raw = String(res || ""), rank = "–", record = "–", playoffs = raw, parsed = false;
  var r = /Rank (\d+)(?: of (\d+))?/.exec(raw);
  if (r) {
    parsed = true;
    rank = r[2] ? r[1] + " of " + r[2] : r[1];
    var rec = /\((\d+-\d+-\d+)\)/.exec(raw);
    if (rec) record = rec[1];
    var i = raw.indexOf(" — ");
    playoffs = i >= 0 ? raw.slice(i + 3) : "–";
  }
  return { rank: rank, record: record, playoffs: playoffs, parsed: parsed };
}
function resType(s) {
  s = String(s || "");
  if (/won the event/i.test(s)) return "win";
  if (/captain/i.test(s)) return "cap";
  if (/pick|playoffs|semifinal|quarterfinal/i.test(s)) return "po";
  return "played";
}
function hasType(r, fn) { return (r.results || []).some(function (x) { return fn(resType(x.result)); }); }
function ytLink(url, text) { return ext(url, text + " ↗"); }

/* ---------- season log ---------- */
function markSvg(type, ev) {
  var big = type === "win", sz = big ? 28 : 22, t = "<title>" + esc(ev.event + ": " + ev.result) + "</title>", body;
  if (type === "win") body = "<circle class=\"m-gold\" cx=\"14\" cy=\"14\" r=\"9\"/><circle class=\"m-ring\" cx=\"14\" cy=\"14\" r=\"12.5\"/>";
  else if (type === "cap") body = "<circle class=\"m-gold\" cx=\"14\" cy=\"14\" r=\"9\"/>";
  else if (type === "po") body = "<circle class=\"m-out\" cx=\"14\" cy=\"14\" r=\"9\"/><circle class=\"m-dot\" cx=\"14\" cy=\"14\" r=\"3.5\"/>";
  else body = "<circle class=\"m-grey\" cx=\"14\" cy=\"14\" r=\"9\"/>";
  return "<svg width=\"" + sz + "\" height=\"" + sz + "\" viewBox=\"0 0 28 28\" role=\"img\" aria-label=\"" + esc(ev.event + ": " + ev.result) + "\">" + t + body + "</svg>";
}
function legendSvg(type) { return markSvg(type, { event: "", result: "" }).replace(/<title>.*?<\/title>/, "").replace(/role="img" aria-label=""/, "aria-hidden=\"true\""); }
function seasonStats() {
  var wins = 0, po = 0;
  ROBOTS.forEach(function (r) { (r.results || []).forEach(function (x) { var t = resType(x.result); if (t === "win") wins++; if (t !== "played") po++; }); });
  return { seasons: ROBOTS.length, wins: wins, po: po };
}
function firstYear() { return Math.min.apply(null, ROBOTS.map(function (r) { return +r.year; })); }
function seasonLog() {
  var ys = ROBOTS.map(function (r) { return +r.year; }), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys), cols = "";
  for (var y = lo; y <= hi; y++) {
    var r = ROBOTS.find(function (x) { return +x.year === y; });
    if (!r) { cols += "<div class=\"sl-col\" title=\"No season in " + y + "\"><div class=\"sl-marks\"><span class=\"sl-dash\" aria-hidden=\"true\">–</span></div><span class=\"sl-year\">" + y + "<span class=\"vh\"> (no season)</span></span><span class=\"sl-name\"></span></div>"; continue; }
    var res = r.results || [], wins = res.filter(function (x) { return resType(x.result) === "win"; });
    var label = y + (r.name ? ", " + r.name : "") + ": " + pl(res.length, "event") + wins.map(function (w) { return ", won the " + w.event; }).join("");
    cols += "<a class=\"sl-col\" href=\"#robot-" + y + "\" aria-label=\"" + esc(label) + "\"><span class=\"sl-marks\">" +
      res.map(function (x) { return markSvg(resType(x.result), x); }).join("") + "</span><span class=\"sl-year\">" + y + "</span><span class=\"sl-name\" title=\"" + esc(r.name) + "\">" + esc(r.name) + "</span></a>";
  }
  return "<div class=\"sl-wrap\" role=\"region\" aria-label=\"Season log, scrolls sideways\" tabindex=\"0\"><div class=\"sl-grid\">" + cols + "</div></div>" +
    "<ul class=\"legend\"><li>" + legendSvg("win") + " Won the event</li><li>" + legendSvg("cap") + " Alliance captain</li><li>" + legendSvg("po") + " Picked or in the playoffs</li><li>" + legendSvg("played") + " Played the event</li></ul>";
}
function seasonSummary() {
  var s = seasonStats();
  return "<p class=\"sl-sum\">" + pl(s.seasons, "season") + " · " + pl(s.wins, "event win") + " · " + pl(s.po, "playoff event") + "</p>";
}

/* ---------- views ---------- */
function nextUp() {
  var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var list = SCHEDULE_2027.map(function (e) { return { e: e, d: parseDates(e.dates) }; }).filter(function (x) { return x.d; });
  var up = list.filter(function (x) { return x.d.end >= now; });
  if (!up.length) return "<div class=\"band rules alt tight\"><div class=\"wrap\"><p class=\"label\">Next event</p><p class=\"next-name\">Season complete</p></div></div>";
  var n = up[0], cd, cdHtml;
  var days = Math.round((n.d.start - today) / 86400000);
  if (days < 0) cd = "Happening now";
  else cd = days === 0 ? "Starts today" : days === 1 ? "Tomorrow" : null;
  cdHtml = cd == null ? "<p class=\"countdown count-big\"><span class=\"stat-n\">" + days + "</span><span class=\"stat-l\">days until the first match day</span></p>" : "<p class=\"countdown\">" + cd + "</p>";
  var rest = up.slice(1).map(function (x) { return "<li><b>" + esc(x.e.event) + "</b><span class=\"mute\">" + esc(x.e.dates) + " · " + esc(x.e.location) + "</span></li>"; }).join("");
  return "<section class=\"band rules alt tight\" aria-label=\"Next event\"><div class=\"wrap next\"><div class=\"next-card\"><span class=\"beam\" aria-hidden=\"true\"><i></i></span><p class=\"label gold\">Next event</p><p class=\"next-name\">" + esc(n.e.event) + "</p><div>" + esc(n.e.dates) + " · " + esc(n.e.location) + "</div>" + cdHtml + "</div>" +
    (rest ? "<div><p class=\"label\">Then</p><ul class=\"later\">" + rest + "</ul></div>" : "") + "</div></section>";
}
function refreshNext() {
  var el = document.getElementById("nextUp");
  if (el) el.innerHTML = nextUp();
}

function newestTier() { return SPONSOR_TIERS.find(function (t) { return t.sponsors.length; }); }
function wm(h) {

}
function ws(s) { return String(s).replace(/\s+/g, " ").trim(); }
var RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
/* Number ticker: spring (damping 60, stiffness 100, mass 1) from 0 to the value, once, when first in view. The DOM already holds the final number. */
function tickerRun(el, to) {
  var fmt = new Intl.NumberFormat("en-US"), x = 0, v = 0, last = null;
  el.textContent = fmt.format(0);
  function frame(t) {
    var dt = last == null ? 0 : Math.min((t - last) / 1000, 0.05), n = Math.max(1, Math.ceil(dt * 240)), h = dt / n, i;
    last = t;
    for (i = 0; i < n; i++) { v += (-100 * (x - to) - 60 * v) * h; x += v * h; }
    if (Math.abs(v) < 0.01 && Math.abs(x - to) < 0.01) { el.textContent = fmt.format(to); return; }
    el.textContent = fmt.format(Number(x.toFixed(0)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { el.textContent = fmt.format(to); }, 6000);
}
function initTickers(root) {
  if (RM.matches || !("IntersectionObserver" in window)) return;
  Array.prototype.forEach.call(root.querySelectorAll("[data-ticker]"), function (el) {
    var to = +el.getAttribute("data-ticker");
    if (!isFinite(to)) return;
    var io = new IntersectionObserver(function (en) {
      if (!en.some(function (e) { return e.isIntersecting; })) return;
      io.disconnect();
      tickerRun(el, to);
    });
    io.observe(el);
  });
}
function seasonStatRow() {
  var s = seasonStats();
  var items = [[s.seasons, "season"], [s.wins, "event win"], [s.po, "playoff event"]];
  return "<ul class=\"stats\" aria-label=\"Competition record\">" + items.map(function (x) {
    return "<li><b class=\"stat-n\" data-ticker=\"" + x[0] + "\">" + x[0] + "</b><span class=\"stat-l\">" + x[1] + (x[0] === 1 ? "" : "s") + "</span></li>";
  }).join("") + "</ul>";
}
/* Timeline fill: progress from container top at 10% of the viewport to container bottom at 50% (Aceternity offset ["start 10%", "end 50%"]); opacity ramps over the first 10% */
var tlBusy = false;
function tlUpdate() {
  tlBusy = false;
  var t = document.getElementById("tline"), f = t && t.querySelector(".tl-fill");
  if (!f || RM.matches) return;
  var r = t.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
  var span = r.height - 0.4 * vh, p = span > 0 ? (0.1 * vh - r.top) / span : (r.top <= 0.1 * vh ? 1 : 0);
  p = Math.max(0, Math.min(1, p));
  f.style.height = (p * r.height).toFixed(1) + "px";
  f.style.opacity = Math.min(1, p / 0.1).toFixed(3);
}
function tlSchedule() { if (tlBusy) return; tlBusy = true; requestAnimationFrame(tlUpdate); }

    "</div></div></section>" +
    (tier ? "<section class=\"band alt\"><div class=\"wrap\"><p class=\"label\">Sponsors, " + esc(tier.tier.replace(/\s*Sponsors?\s*/i, "").trim()) + " season</p>" + names(tier) + "<a class=\"btn btn-line\" href=\"#sponsors\">Become a sponsor</a></div></section>" : "");

var curFilter = "all";
var FILTERS = [["all", "All"], ["win", "Event winners"], ["po", "Playoffs"], ["svc", "In service"]];
function passes(r, f) {
  if (f === "win") return hasType(r, function (t) { return t === "win"; });
  if (f === "po") return hasType(r, function (t) { return t !== "played"; });
  if (f === "svc") return r.status === "In service";

}

    : "<img src=\"img/r" + r.year + ".jpg\" width=\"1000\" height=\"750\" loading=\"lazy\" alt=\"" + esc(r.name ? r.name + ", the " + r.year + " robot" : "The " + r.year + " robot") + "\"" + (r.imagePosition ? " style=\"object-position:" + esc(r.imagePosition) + "\"" : "") + ">";
  return "<a class=\"card\" href=\"#robot-" + r.year + "\"><div class=\"photo r43\">" + photo + "</div><div class=\"card-b\"><p class=\"label\">" + r.year + " · " + esc(r.game) + "</p><h3 class=\"h3\">" + esc(robotName(r)) + "</h3>" +
    (r.stats ? "<p>" + esc(r.stats) + "</p>" : "") + (r.status === "In service" ? "<span class=\"chip\">In service</span>" : "") + "</div></a>";
}

  var list = ROBOTS.filter(function (r) { return passes(r, curFilter); });

    }).join("") + "</ul></div></section>" : "") +
    (pub.length ? "<section class=\"band tight\"><div class=\"wrap\"><h2 class=\"h2\">In the press</h2><ul class=\"links\">" + pub.map(function (p) {
      return "<li class=\"press\">" + ext(p.url, p.title + " ↗") + "<span class=\"mute small\">" + esc(p.outlet) + "</span></li>";
    }).join("") + "</ul><p style=\"margin-top:16px\">Press inquiries are welcome. We coordinate them with Dawson School before materials or comments go out, so please reach us through the <a href=\"#contact\">contact page</a>.</p></div></section>" : "") +
    "<section class=\"band alt tight\"><div class=\"wrap\"><h2 class=\"h2\">Photos</h2><p>More photos are on our robot pages and on Instagram.</p><div class=\"tl-links\"><a class=\"tl-link\" href=\"#robots\">Robot pages →</a>" + ext(SITE.instagram, "Instagram " + SITE.instagramHandle + " ↗").replace("<a ", "<a class=\"tl-link\" ") + "</div></div></section>";
}
function viewContact() {
  return "<section class=\"band\"><div class=\"wrap\"><h1 class=\"h1\" tabindex=\"-1\">Contact</h1><p class=\"lead\">Questions, sponsorship interest, or want to mentor? Reach out.</p>" +
    "<div class=\"grid2 top\" style=\"margin-top:32px\"><div><p class=\"label\">Email</p><p>With any questions or concerns, please reach out.</p><div class=\"addr-big\">" + addr() + "</div>" +
    "<p class=\"label\" style=\"margin-top:32px\">Instagram</p><p>Follow along with build season and competitions. We don't check Instagram messages, so please email us instead.</p><p>" + ext(SITE.instagram, "Instagram " + SITE.instagramHandle + " ↗") + "</p>" +
    "<p class=\"label\" style=\"margin-top:32px\">School</p><p>" + esc(SITE.school) + ", " + esc(SITE.location) + "</p><p>" + ext(SITE.schoolUrl, "Visit Dawson School ↗") + "</p></div>" +
    "<div><p class=\"label\">Where to next</p><ul class=\"route\"><li><a href=\"#join\">Join as a student →</a></li><li><a href=\"#join-mentors\">Mentor the team →</a></li><li><a href=\"#sponsors\">Sponsor the team →</a></li></ul></div></div></div></section>";
}

function viewFooter() {
  return "<div class=\"wrap ft\"><div><p class=\"h3\" style=\"font-family:var(--display)\">FRC Team " + SITE.teamNumber + " · " + esc(SITE.school) + " · " + esc(SITE.location) + " · Since " + esc(SITE.founded) + "</p><p>" + esc(SITE.teamName) + "</p>" + wm(40) + "</div>" +
    "<div><p class=\"label\">Contact</p><p>" + addr() + "</p><p>" + ext(SITE.instagram, "Instagram " + SITE.instagramHandle + " ↗") + "</p></div>" +
    "<div><p class=\"label\">Pages</p><ul><li><a href=\"#sponsors\">Become a sponsor</a></li><li><a href=\"#join-mentors\">Become a mentor</a></li><li><a href=\"#join\">Become a team member</a></li><li><a href=\"#robots\">Robots</a></li><li><a href=\"#about\">About</a></li><li><a href=\"#outreach\">Outreach</a></li><li><a href=\"#media\">Media</a></li><li><a href=\"#resources\">Resources</a></li><li><a href=\"#contact\">Contact</a></li></ul></div></div>";
}

/* ---------- router ---------- */
function resolve(hash) {
  var h = String(hash || "").replace(/^#/, "");
  if (!/^[A-Za-z0-9-]+$/.test(h)) return "home";
  if (h === "home" || h === "robots" || h === "sponsors" || h === "join" || h === "join-mentors" || h === "about" || h === "resources" || h === "outreach" || h === "media" || h === "contact") return h;
  var m = /^robot-(\d{4})$/.exec(h);
  if (m && ROBOTS.some(function (r) { return r.year === m[1]; })) return h;
  return "home";
}
function render() {
  var r = resolve(location.hash), html, m = /^robot-(\d{4})$/.exec(r);
  if (m) html = viewRobot(m[1]);
  else if (r === "join-mentors") html = viewJoin("mentors");
  else html = { home: viewHome, robots: viewRobots, sponsors: viewSponsors, join: viewJoin, about: viewAbout, resources: viewResources, outreach: viewOutreach, media: viewMedia, contact: viewContact }[r]();
  var view = document.getElementById("view");
  view.innerHTML = html;
  var key = m ? "robots" : r === "join-mentors" ? "join" : r;
  Array.prototype.forEach.call(document.querySelectorAll(".nav a.nl"), function (a) {
    if (a.getAttribute("data-r") === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("hdr").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
  initTickers(view);
  window.scrollTo(0, 0);
  tlUpdate();
  var h1 = view.querySelector("h1");
  if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
}
function init() {
  document.getElementById("ftr").innerHTML = viewFooter();
  window.addEventListener("hashchange", render);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refreshNext(); });
  setInterval(refreshNext, 30 * 60 * 1000);
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || t.getAttribute("role") !== "tab") return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var next = t.getAttribute("data-tab") === "students" ? "mentors" : "students";
    setTab(next);
    var nb = document.getElementById("tab-" + next);
    if (nb) nb.focus();
    e.preventDefault();
  });
  document.getElementById("menuBtn").addEventListener("click", function () {
    var o = document.getElementById("hdr").classList.toggle("open");
    this.setAttribute("aria-expanded", String(o));
  });
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "res-q") { resQ = e.target.value; resRefresh(); }
  });
  document.addEventListener("click", function (e) {
    var rc = e.target.closest ? e.target.closest("[data-rescat]") : null;
    if (rc) {
      resCat = rc.getAttribute("data-rescat");
      Array.prototype.forEach.call(document.querySelectorAll("[data-rescat]"), function (b) { b.setAttribute("aria-pressed", String(b === rc)); });
      resRefresh();
      return;
    }
    if (e.target.closest && e.target.closest("[data-resclear]")) {
      resQ = "";
      var qi = document.getElementById("res-q");
      if (qi) { qi.value = ""; qi.focus(); }
      resRefresh();
      return;
    }
    var tb = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (tb) { setTab(tb.getAttribute("data-tab")); return; }
    var f = e.target.closest ? e.target.closest("[data-filter]") : null;
    if (f) {
      curFilter = f.getAttribute("data-filter");
      var g = gridHtml();
      document.getElementById("grid").innerHTML = g.html;
      document.getElementById("count").textContent = g.count;
      Array.prototype.forEach.call(document.querySelectorAll("[data-filter]"), function (b) { b.setAttribute("aria-pressed", String(b === f)); });
      return;
    }
    var b = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (!b) return;
    var t = b.parentNode.querySelector(".addr-t"), txt = t.textContent;
    var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 2000); };
    var sel = function () {
      try { var rg = document.createRange(); rg.selectNodeContents(t); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); } catch (x) { /* ignore */ }
      b.textContent = "Selected"; setTimeout(function () { b.textContent = "Copy"; }, 2000);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, sel); else sel();
    } catch (x) { sel(); }
  });
  window.addEventListener("scroll", tlSchedule, { passive: true });
  window.addEventListener("resize", tlSchedule, { passive: true });
  render();
}
if (typeof document !== "undefined") init();
</script>

</body>
</html>
