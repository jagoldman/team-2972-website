# gitleaks config (infra/docs/CONVENTIONS.md §9).
# Uses gitleaks' default rules. Never disable the scan; allowlist known fake test keys by path only.
title = "2972 landing"

[extend]
useDefault = true

[allowlist]
description = "Fake values used only by local container tests; the shell kit's sync stamp (file hashes, not keys)"
paths = [
  '''^test/''',
  # SHA-256 hashes of the synced kit files (infra scripts/sync-shell.sh). Kit 0.1.7 changed the format, but
  # older stamps in history match the generic-api-key rule.
  '''^shell/SYNC\.json$''',
]
