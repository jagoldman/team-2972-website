<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Resources</h1>
  <p>Documents, code, and guides for team members and other FRC teams.</p>
</div>

<section class="block">
  <div class="block-inner" id="resource-groups"></div>
</section>

<section class="block alt" id="cad-overview">
  <div class="block-inner">
    <h2 class="section-title">3D CAD/CAM Modeling Overview</h2>
    <div class="cad-overview" id="cad-body"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // Links still set to "#" are hidden; groups with nothing left are skipped
  const external = url => /^https?:/.test(url);
  document.getElementById("resource-groups").innerHTML = RESOURCE_LINKS
    .map(group => ({ ...group, items: group.items.filter(item => isSet(item.url)) }))
    .filter(group => group.items.length)
    .map(group => `
      <div class="resource-group">
        <h3>${group.category}</h3>
        <ul>
          ${group.items.map(item => `<li><a href="${item.url}"${item.download ? ` download="${item.download}"` : ""}${external(item.url) ? ' target="_blank" rel="noopener"' : ""}><span>${item.label}${item.note ? `<small class="res-note">${item.note}</small>` : ""}</span></a></li>`).join("")}
        </ul>
      </div>
    `).join("");

  document.getElementById("cad-body").innerHTML = CAD_OVERVIEW.map(part => `
    <div class="cad-part">
      <h3>${part.heading}</h3>
      ${part.body ? `<p>${part.body}</p>` : ""}
      ${part.list ? `<ul>${part.list.map(li => `<li>${li}</li>`).join("")}</ul>` : ""}
      ${part.after ? `<p>${part.after}</p>` : ""}
    </div>
  `).join("");
});
</script>
</body>
</html>
