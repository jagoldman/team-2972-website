<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources | Team 2972 Gears & Buccaneers</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Resources</h1>
  <p>Documents, code, and guides for team members and other FRC teams.</p>
</div>

<section class="block">
  <div class="block-inner" id="resource-groups"></div>
</section>

<div id="site-footer"></div>

<script src="js/content.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("resource-groups").innerHTML = RESOURCE_LINKS.map(group => `
    <div class="resource-group">
      <h3>${group.category}</h3>
      <ul>
        ${group.items.map(item => `<li><a href="${item.url}" target="_blank" rel="noopener">${item.label}</a></li>`).join("")}
      </ul>
    </div>
  `).join("");
});
</script>
</body>
</html>
