<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="resources-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// Filters by category and a search box over the links. Both are kept while the page is re-rendered (the editor's preview).
let resCat = "all", resQ = "";
const external = (url) => /^https?:/i.test(url);

// Links still set to "#" are hidden; categories with nothing left are skipped. Indexes stay the ones in RESOURCE_LINKS,
// so the data-ck paths are right even when something is hidden.
function visibleGroups() {
  return RESOURCE_LINKS.map((group, gi) => ({ group, gi, items: group.items.map((item, ii) => ({ item, ii })).filter(({ item }) => isSet(item.url)) })).filter((g) => g.items.length);
}
function matches(item, q) {
  const text = `${item.label} ${item.note || ""}`.toLowerCase();
  return !q || text.includes(q.toLowerCase());
}
// One link: an outside address opens in a new tab (and says so); a file to download (the logo) downloads; a page or
// place on this site ("#cad-overview") opens here.
function resourceLink(item, P) {
  const href = safeUrl(item.url), label = `<span${ck(`${P}.label`)}>${esc(item.label)}</span>`;
  if (item.download) return `<a href="${esc(href)}" download="${esc(item.download)}"${ckHref(`${P}.url`)}>${label}</a>`;
  if (external(href)) return extLink(href, label, ckHref(`${P}.url`));
  return `<a href="${esc(href)}"${ckHref(`${P}.url`)}>${label}</a>`;
}
function listHtml() {
  let n = 0;
  const html = visibleGroups().map(({ group, gi, items }) => {
    if (resCat !== "all" && group.category !== resCat) return "";
    const shown = items.filter(({ item }) => matches(item, resQ));
    if (!shown.length) return "";
    n += shown.length;
    return `<div class="res-cat"${ck(`RESOURCE_LINKS[${gi}]`)}><h2${ck(`RESOURCE_LINKS[${gi}].category`)}>${esc(group.category)}</h2>
      <ul class="res-list"${ck(`RESOURCE_LINKS[${gi}].items`)}>${shown.map(({ item, ii }) => {
        const P = `RESOURCE_LINKS[${gi}].items[${ii}]`;
        return `<li${ck(P)}>${resourceLink(item, P)}${item.note ? `<span class="res-note"${ck(`${P}.note`)}>${esc(item.note)}</span>` : ""}</li>`;
      }).join("")}</ul></div>`;
  }).join("");
  return { count: `Showing ${plural(n, "link")}`, html: n ? html : `<p class="res-none">No link matches that search. <button type="button" class="asbtn" data-resclear>Clear the search</button></p>` };
}
function refresh() {
  const g = listHtml();
  document.getElementById("resource-groups").innerHTML = g.html;
  document.getElementById("res-count").textContent = g.count;
}

function render() {
  const g = listHtml();
  const cats = [["all", "All"]].concat(visibleGroups().map(({ group }) => [group.category, group.category]));
  const onshape = extLink(SITE.onshapePublic, "public Onshape publication", ' id="onshape-public" data-ck-href="SITE.onshapePublic"') || "public Onshape publication";
  document.getElementById("resources-page").innerHTML = `
    <section class="band band-first"><div class="wrap"><h1 tabindex="-1">Resources</h1><p class="lead">Documents, code, and guides for team members and other FRC teams.</p>
      <div class="res-tools"><div class="filters" role="group" aria-label="Filter by category">${cats.map(([v, label]) => `<button type="button" class="filter" data-ck-ignore data-rescat="${esc(v)}" aria-pressed="${resCat === v}">${esc(label)}</button>`).join("")}</div>
        <div class="field"><label for="res-q">Search resources</label><input type="search" id="res-q" autocomplete="off" value="${esc(resQ)}"></div></div>
      <p class="small mute tab res-count" id="res-count" aria-live="polite">${g.count}</p>
      <div class="res-cols" id="resource-groups"${ck("RESOURCE_LINKS")}>${g.html}</div></div></section>
    <section class="band band-floor" id="request-access"><div class="wrap"><h2>Code, CAD and the Team Drive</h2>
      <p class="measure">Anyone can read our robot code on GitHub and view our robots in the ${onshape}. The team's Google Drive and the editable Onshape CAD are shared by invitation only. Team members can ask for access here.</p>
      <div id="team-tools">${renderTeamTools()}</div><div id="request-access-body">${siteRequestAccess()}</div></div></section>
    <section class="band" id="cad-overview"><div class="wrap">
      <!-- fixed page heading; it only happens to match a link label, so it is not a content field -->
      <h2 data-ck-ignore>3D CAD/CAM Modeling Overview</h2>
      <div class="cad"${ck("CAD_OVERVIEW")}>${CAD_OVERVIEW.map((part, i) => `<details class="disc"${ck(`CAD_OVERVIEW[${i}]`)}><summary${ck(`CAD_OVERVIEW[${i}].heading`)}>${esc(part.heading)}</summary>
        ${part.body ? `<p${ck(`CAD_OVERVIEW[${i}].body`, "rich")}>${rich(part.body)}</p>` : ""}
        ${part.list ? `<ul${ck(`CAD_OVERVIEW[${i}].list`)}>${part.list.map((li, j) => `<li${ck(`CAD_OVERVIEW[${i}].list[${j}]`, "rich")}>${rich(li)}</li>`).join("")}</ul>` : ""}
        ${part.after ? `<p${ck(`CAD_OVERVIEW[${i}].after`, "rich")}>${rich(part.after)}</p>` : ""}</details>`).join("")}</div></div></section>`;
}

let resWired = false;
onContent(() => {
  render();
  if (resWired) return;
  resWired = true;
  document.addEventListener("input", (e) => { if (e.target && e.target.id === "res-q") { resQ = e.target.value; refresh(); } });
  document.addEventListener("click", (e) => {
    const cat = e.target.closest && e.target.closest("[data-rescat]");
    if (cat) {
      resCat = cat.getAttribute("data-rescat");
      document.querySelectorAll("[data-rescat]").forEach((b) => b.setAttribute("aria-pressed", String(b === cat)));
      refresh();
      return;
    }
    if (e.target.closest && e.target.closest("[data-resclear]")) {
      resQ = "";
      const q = document.getElementById("res-q");
      if (q) { q.value = ""; q.focus(); }
      refresh();
    }
  });
});
</script>
</body>
</html>
