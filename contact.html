<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="contact-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  const school = safeUrl(SITE.schoolUrl);
  document.getElementById("contact-page").innerHTML = `
    <section class="band"><div class="wrap"><h1 class="h1" tabindex="-1">Contact</h1><p class="lead">Questions, sponsorship interest, or want to mentor? Reach out.</p>
      <div class="grid2 top spaced"><div>
        <p class="label">Email</p><p>With any questions or concerns, please reach out.</p><div class="addr-big">${emailAddress()}</div>
        <p class="label spaced">Instagram</p><p>Follow along with build season and competitions. We don't check Instagram messages, so please email us instead.</p>
        <p><a id="ig-link" href="${esc(safeUrl(SITE.instagram))}" target="_blank" rel="noopener" data-ck-href="SITE.instagram">Instagram <span${ck("SITE.instagramHandle")}>${esc(SITE.instagramHandle)}</span> ↗</a></p>
        <p class="label spaced">School</p><p><span${ck("SITE.school")}>${esc(SITE.school)}</span>, <span${ck("SITE.location")}>${esc(SITE.location)}</span></p>
        ${school ? `<p><a href="${esc(school)}" target="_blank" rel="noopener"${ckHref("SITE.schoolUrl")}>Visit Dawson School ↗</a></p>` : ""}
      </div><div><p class="label">Where to next</p><ul class="route"><li><a href="member.html">Join as a student →</a></li><li><a href="mentor.html">Mentor the team →</a></li><li><a href="sponsors.html">Sponsor the team →</a></li></ul></div></div>
    </div></section>`;
});
</script>
</body>
</html>
