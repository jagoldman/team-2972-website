<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Contact</h1>
  <p>Questions, sponsorship interest, or want to mentor? Reach out.</p>
</div>

<section class="block">
  <div class="block-inner">
    <div class="contact-grid">
      <div class="contact-card">
        <h3>Email</h3>
        <p>With any questions or concerns, please reach out.</p>
        <a class="btn" id="email-link"></a>
      </div>
      <div class="contact-card">
        <h3>Instagram</h3>
        <p>Follow along with build season and competitions.</p>
        <a class="btn btn-outline" id="ig-link" target="_blank" rel="noopener"></a>
      </div>
      <div class="contact-card">
        <h3>Sponsor Us</h3>
        <p>Interested in supporting the team?</p>
        <a class="btn btn-outline" href="sponsors.html">View sponsorship info</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const emailLink = document.getElementById("email-link");
  emailLink.href = `mailto:${SITE.email}`;
  // On a very narrow phone the address wraps after the "@", not mid-word.
  const at = SITE.email.indexOf("@") + 1;
  emailLink.append(SITE.email.slice(0, at), document.createElement("wbr"), SITE.email.slice(at));

  const igLink = document.getElementById("ig-link");
  igLink.href = SITE.instagram;
  igLink.textContent = SITE.instagramHandle;
});
</script>
</body>
</html>
