<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sponsors | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="sponsors-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  const today = HISTORY.today;
  // What support has built: the team milestones, newest first (three of them), as dated lines.
  const built = [];
  HISTORY.milestones.forEach((m, i) => (m.items || []).forEach((it, j) => { if (it.kind === "team") built.push({ i, j, m, it }); }));
  built.sort((a, b) => Number(b.m.year) - Number(a.m.year));
  const stands = today.image
    ? `<div class="photo r32"><img${imgAttrs(today.image, 800)}${ck("HISTORY.today.image")}${ckAlt("HISTORY.today.imageAlt")} alt="${esc(altFor(today.image, today.imageAlt || today.heading))}" loading="lazy" width="1000" height="666"></div>` : "";
  const packet = safeUrl(contentGet("SPONSOR_PACKET_URL"));

  // A tier with no sponsors yet is hidden on the public site. In the editor preview (window.__editorOverlay,
  // set by the editor's overlay.js) it is shown, so its tier and list hooks can be reached.
  const tiers = SPONSOR_TIERS.map((tier, i) => {
    const show = tier.sponsors.length > 0 || inEditorPreview();
    return `<section class="band${show && i % 2 ? " alt" : ""}"${show ? "" : " hidden"}${ck(`SPONSOR_TIERS[${i}]`)}><div class="wrap">
      <h2 class="h2"${ck(`SPONSOR_TIERS[${i}].tier`)}>${esc(tier.tier)}</h2>
      ${tier.banner ? `<img class="sponsor-banner"${imgAttrs(tier.banner, 1600)}${ck(`SPONSOR_TIERS[${i}].banner`)} alt="${esc(altFor(tier.banner, tier.tier + " banner"))}" loading="lazy" />` : ""}
      ${sponsorNames(tier, i)}</div></section>`;
  }).join("");

  document.getElementById("sponsors-page").innerHTML = `
    <section class="band"><div class="wrap grid2 top"><div>
      <h1 class="h1" tabindex="-1">Sponsor the team</h1>
      <p class="lead">Team ${esc(SITE.teamNumber)} runs on the generosity of local businesses, families, and our school.</p>
      <p>Every dollar goes directly toward robot parts, competition fees, travel, and outreach, and toward improving our shop: the tools, machines and workspace where students build.</p>
      <div class="btns">${packet ? `<a class="btn btn-gold" id="packet-link" href="${esc(packet)}" target="_blank" rel="noopener" data-ck-href="SPONSOR_PACKET_URL">Sponsorship packet ↗</a>` : ""}${emailAddress()}</div>
    </div>${stands}</div></section>
    ${built.length || today.paragraphs.length ? `<section class="band alt"><div class="wrap"><h2 class="h2">What support has built</h2>
      <div${ck("HISTORY.today.paragraphs")}>${today.paragraphs.map((p, j) => `<p${ck(`HISTORY.today.paragraphs[${j}]`, "rich")}>${rich(p)}</p>`).join("")}</div>
      ${built.length ? `<ul class="dated"${ck("HISTORY.milestones")}>${built.slice(0, 3).map(({ i, j, m, it }) => `<li><b${ck(`HISTORY.milestones[${i}].year`)}>${esc(m.year)}</b><span${ck(`HISTORY.milestones[${i}].items[${j}].text`, "rich")}>${rich(it.text)}</span></li>`).join("")}</ul>` : ""}</div></section>` : ""}
    <div${ck("SPONSOR_TIERS")}>${tiers}</div>`;
});
</script>
</body>
</html>
