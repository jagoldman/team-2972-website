<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="media-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// A YouTube embed address becomes the address people watch at (nothing is embedded: the video opens on YouTube).
function watchUrl(embed) {
  const m = /^https:\/\/www\.youtube\.com\/embed\/([\w-]{11})(?:\?start=(\d+))?$/.exec(embed);
  return m ? `https://www.youtube.com/watch?v=${m[1]}${m[2] ? `&t=${m[2]}s` : ""}` : "";
}
const sec = (title, body, id) => `<section class="sec"${id ? ` id="${id}"` : ""}><h2>${title}</h2><div class="sec-body">${body}</div></section>`;
onContent(() => {
  const videos = MEDIA_VIDEOS
    .map((v, i) => ({ src: youtubeEmbed(typeof v === "string" ? v : v.url), caption: typeof v === "string" ? "" : (v.caption || ""), i, obj: typeof v !== "string" }))
    .filter((v) => v.src);
  const videoList = videos.length
    ? `<ul class="links" id="video-grid"${ck("MEDIA_VIDEOS")}>${videos.map((v) => `<li${ck(`MEDIA_VIDEOS[${v.i}]`)}><span${v.caption ? ck(`MEDIA_VIDEOS[${v.i}].caption`) : ""}>${esc(v.caption || `Team ${SITE.teamNumber} video`)}</span>${extLink(watchUrl(v.src), "Watch on YouTube", ckHref(v.obj ? `MEDIA_VIDEOS[${v.i}].url` : `MEDIA_VIDEOS[${v.i}]`))}</li>`).join("")}</ul>`
    : `<div id="video-grid"${ck("MEDIA_VIDEOS")}><p class="empty-note">Video gallery coming soon.</p></div>`;
  const press = MEDIA_PUBLICITY.length
    ? `<ul class="links"${ck("MEDIA_PUBLICITY")}>${MEDIA_PUBLICITY.map((p, i) => `<li class="press"${ck(`MEDIA_PUBLICITY[${i}]`)}>${extLink(p.url, `<span${ck(`MEDIA_PUBLICITY[${i}].title`)}>${esc(p.title)}</span>`, ckHref(`MEDIA_PUBLICITY[${i}].url`))}<span class="mute small"${ck(`MEDIA_PUBLICITY[${i}].outlet`)}>${esc(p.outlet)}</span></li>`).join("")}</ul>`
    : `<p class="empty-note"${ck("MEDIA_PUBLICITY")}>No press coverage listed yet.</p>`;
  // Photos: the team's uploads (MEDIA_PHOTOS) in a grid, each opening the large copy in a new tab.
  const photos = MEDIA_PHOTOS.length
    ? `<div class="pics" id="photo-grid"${ck("MEDIA_PHOTOS")}>${MEDIA_PHOTOS.map((src, i) => ({ src, i })).filter(({ src }) => hasPhoto(src)).map(({ src, i }) => `<a class="shot r43" href="${esc(imgUrl(src, 1600))}" target="_blank" rel="noopener"${ck(`MEDIA_PHOTOS[${i}]`)}><img${imgSized(src, [400, 800], "(min-width: 900px) 220px, 50vw")}${ck(`MEDIA_PHOTOS[${i}]`)} alt="${esc(altFor(src, "Team photo"))}" loading="lazy" width="600" height="450" /><span class="vh"> (opens in a new tab)</span></a>`).join("")}</div>`
    : `<div id="photo-grid"${ck("MEDIA_PHOTOS")}><p class="empty-note">Photo gallery coming soon.</p></div>`;
  const instagram = extLink(SITE.instagram, `Instagram <span${ck("SITE.instagramHandle")}>${esc(SITE.instagramHandle)}</span>`, ' class="textlink" id="ig-link" data-ck-href="SITE.instagram"');
  document.getElementById("media-page").innerHTML = `
    <section class="band band-first media-head"><div class="wrap"><h1 tabindex="-1">Media</h1><p class="lead">Photos, videos, and press coverage of the team.</p></div></section>
    <div class="wrap media-body">
      ${sec("Videos", videoList)}
      ${sec("In the press", `${press}<p>Press inquiries are welcome. We coordinate them with Dawson School before materials or comments go out, so please reach us through the <a href="contact.html">contact page</a>.</p>`)}
      ${sec("Photos", `${photos}<p>More photos are on our robot pages and on Instagram.</p><p class="linkrow"><a class="textlink" href="robots.html">Robot pages</a>${instagram}</p>`)}
      ${sec("Follow along", `<p>Follow us on Instagram for behind-the-scenes updates from build season. We don't check messages there; to reach us, use the <a href="contact.html">contact page</a>.</p>`)}
    </div>`;
});
</script>
</body>
</html>
