<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Media</h1>
  <p>Photos, videos, and press coverage of the team.</p>
</div>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title">Photos</h2>
    <div class="grid" id="photo-grid"></div>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Videos</h2>
    <div class="grid" id="video-grid"></div>
  </div>
</section>

<section class="block">
  <div class="block-inner">
    <h2 class="section-title">Publicity</h2>
    <div id="publicity-list"></div>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Follow Along</h2>
    <p class="section-lead">Follow us on Instagram for behind-the-scenes updates from build season.</p>
    <div class="btn-row">
      <a class="btn" id="ig-link" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  const ig = document.getElementById("ig-link");
  ig.href = safeUrl(SITE.instagram);
  ig.setAttribute("data-ck-href", "SITE.instagram");
  ig.innerHTML = `Instagram <span${ck("SITE.instagramHandle")}>${esc(SITE.instagramHandle)}</span>`;

  // Each grid's own data-ck is its list, so an empty list can still be given a first item.
  const photoGrid = document.getElementById("photo-grid");
  photoGrid.setAttribute("data-ck", "MEDIA_PHOTOS");
  photoGrid.innerHTML = MEDIA_PHOTOS.length
    ? MEDIA_PHOTOS.map((src, i) => `<div class="card"${ck(`MEDIA_PHOTOS[${i}]`)}><img${imgAttrs(src, 600)}${ck(`MEDIA_PHOTOS[${i}]`)} alt="${esc(altFor(src, "Team photo"))}" loading="lazy" /></div>`).join("")
    : `<p class="empty-note">Photo gallery coming soon.</p>`;

  const videoGrid = document.getElementById("video-grid");
  videoGrid.setAttribute("data-ck", "MEDIA_VIDEOS");
  const videos = MEDIA_VIDEOS
    .map((v, i) => ({ src: youtubeEmbed(typeof v === "string" ? v : v.url), caption: typeof v === "string" ? "" : (v.caption || ""), i }))
    .filter(v => v.src);
  videoGrid.innerHTML = videos.length
    ? videos.map(v => `<div class="card"${ck(`MEDIA_VIDEOS[${v.i}]`)}><iframe src="${esc(v.src)}" title="${esc(v.caption || "Team video")}" loading="lazy" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;"></iframe>${v.caption ? `<div class="card-body"><p${ck(`MEDIA_VIDEOS[${v.i}].caption`)}>${esc(v.caption)}</p></div>` : ""}</div>`).join("")
    : `<p class="empty-note">Video gallery coming soon.</p>`;

  const publicity = document.getElementById("publicity-list");
  publicity.setAttribute("data-ck", "MEDIA_PUBLICITY");
  publicity.innerHTML = MEDIA_PUBLICITY.length
    ? `<ul>${MEDIA_PUBLICITY.map((p, i) => `<li${ck(`MEDIA_PUBLICITY[${i}]`)}><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener"${ck(`MEDIA_PUBLICITY[${i}].title`)}${ckHref(`MEDIA_PUBLICITY[${i}].url`)}>${esc(p.title)}</a> — <span${ck(`MEDIA_PUBLICITY[${i}].outlet`)}>${esc(p.outlet)}</span></li>`).join("")}</ul>`
    : `<p class="empty-note">No press coverage listed yet.</p>`;
});
</script>
</body>
</html>
