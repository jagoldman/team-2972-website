<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#101827" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<main id="media-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// A YouTube embed address becomes the address people watch at (nothing is embedded: the video opens on YouTube).
function watchUrl(embed) {
  const m = /^https:\/\/www\.youtube\.com\/embed\/([\w-]{11})(?:\?start=(\d+))?$/.exec(embed);
  return m ? `https://www.youtube.com/watch?v=${m[1]}${m[2] ? `&t=${m[2]}s` : ""}` : "";
}
onContent(() => {
  const videos = MEDIA_VIDEOS
    .map((v, i) => ({ src: youtubeEmbed(typeof v === "string" ? v : v.url), caption: typeof v === "string" ? "" : (v.caption || ""), i, obj: typeof v !== "string" }))
    .filter((v) => v.src);
  const photos = MEDIA_PHOTOS.length
    ? `<div class="photo-grid" id="photo-grid"${ck("MEDIA_PHOTOS")}>${MEDIA_PHOTOS.map((src, i) => `<a class="photo r43" href="${esc(imgUrl(src, 1600))}" target="_blank" rel="noopener"${ck(`MEDIA_PHOTOS[${i}]`)}><img${imgAttrs(src, 600)}${ck(`MEDIA_PHOTOS[${i}]`)} alt="${esc(altFor(src, "Team photo"))}" loading="lazy" width="600" height="450" /></a>`).join("")}</div>`
    : `<div id="photo-grid"${ck("MEDIA_PHOTOS")}><p class="empty-note">Photo gallery coming soon.</p></div>`;
  const press = MEDIA_PUBLICITY.length
    ? `<ul class="links"${ck("MEDIA_PUBLICITY")}>${MEDIA_PUBLICITY.map((p, i) => `<li class="press"${ck(`MEDIA_PUBLICITY[${i}]`)}><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener"${ck(`MEDIA_PUBLICITY[${i}].title`)}${ckHref(`MEDIA_PUBLICITY[${i}].url`)}>${esc(p.title)}</a> ↗<span class="mute small" ${ck(`MEDIA_PUBLICITY[${i}].outlet`).trim()}>${esc(p.outlet)}</span></li>`).join("")}</ul>`
    : `<p class="empty-note"${ck("MEDIA_PUBLICITY")}>No press coverage listed yet.</p>`;
  document.getElementById("media-page").innerHTML = `
    <section class="band"><div class="wrap"><h1 class="h1" tabindex="-1">Media</h1><p class="lead">Photos, videos, and press coverage of the team.</p></div></section>
    <section class="band alt tight"><div class="wrap"><h2 class="h2">Photos</h2>${photos}</div></section>
    <section class="band tight"><div class="wrap"><h2 class="h2">Videos</h2>
      ${videos.length ? `<ul class="links rows" id="video-grid"${ck("MEDIA_VIDEOS")}>${videos.map((v) => `<li${ck(`MEDIA_VIDEOS[${v.i}]`)}><span${v.caption ? ck(`MEDIA_VIDEOS[${v.i}].caption`) : ""}>${esc(v.caption || "Team video")}</span><a href="${esc(watchUrl(v.src))}" target="_blank" rel="noopener"${ckHref(v.obj ? `MEDIA_VIDEOS[${v.i}].url` : `MEDIA_VIDEOS[${v.i}]`)}>Watch on YouTube ↗</a></li>`).join("")}</ul>` : `<div id="video-grid"${ck("MEDIA_VIDEOS")}><p class="empty-note">Video gallery coming soon.</p></div>`}</div></section>
    <section class="band alt tight"><div class="wrap"><h2 class="h2">In the press</h2>${press}
      <p class="spaced-sm">Press inquiries are welcome. We coordinate them with Dawson School before materials or comments go out, so please reach us through the <a href="contact.html">contact page</a>.</p></div></section>
    <section class="band tight"><div class="wrap"><h2 class="h2">Follow along</h2><p>Follow us on Instagram for behind-the-scenes updates from build season. We don't check messages there; to reach us, use the <a href="contact.html">contact page</a>.</p>
      <div class="tl-links"><a class="tl-link" href="robots.html">Robot pages →</a><a class="tl-link" id="ig-link" href="${esc(safeUrl(SITE.instagram))}" target="_blank" rel="noopener" data-ck-href="SITE.instagram">Instagram <span${ck("SITE.instagramHandle")}>${esc(SITE.instagramHandle)}</span> ↗</a></div></div></section>`;
});
</script>
</body>
</html>
