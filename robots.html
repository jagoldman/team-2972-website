<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRC Robots | Team 2972 Gears & Buccaneers</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Our Robots</h1>
  <p>Every season brings a new game — and a new robot to solve it.</p>
</div>

<section class="block">
  <div class="block-inner">
    <div class="grid robot-archive" id="robot-archive"></div>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Help us fill in the archive</h2>
    <p class="section-lead" id="archive-ask"></p>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("robot-archive").innerHTML = ROBOTS.map(r => `
    <a class="card robot-card${r.image ? "" : " no-photo"}" href="${robotUrl(r)}">
      ${r.image
        ? `<img src="${driveImg(r.image, 800)}" alt="${robotName(r)}, the ${r.year} robot" loading="lazy" />`
        : `<div class="photo-wanted"><span>${r.year}</span>Photo wanted</div>`}
      <div class="card-body">
        <div class="meta">${r.year} · ${r.game}</div>
        <h3>${robotName(r)}</h3>
        ${r.tagline ? `<p>${r.tagline}</p>` : ""}
        ${r.stats ? `<p class="stats-line">${r.stats}</p>` : ""}
      </div>
    </a>
  `).join("");

  document.getElementById("archive-ask").innerHTML = `We don't have photos or names for many of
    our older robots. Were you on the team? Send photos, robot names, or stories to
    <a href="mailto:${SITE.email}">${SITE.email}</a>.`;
});
</script>
</body>
</html>
