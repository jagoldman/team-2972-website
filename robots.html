<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRC Robots | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <h1>Our Robots</h1>
  <p>Every season brings a new game — and a new robot to solve it.</p>
</div>

<section class="block">
  <div class="block-inner">
    <div class="grid robot-archive" id="robot-archive"></div>
  </div>
</section>

<section class="block alt">
  <div class="block-inner">
    <h2 class="section-title">Help us fill in the archive</h2>
    <p class="section-lead" id="archive-ask"></p>
  </div>
</section>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
onContent(() => {
  const archive = document.getElementById("robot-archive");
  archive.setAttribute("data-ck", "ROBOTS");
  archive.innerHTML = ROBOTS.map((r, i) => `
    <a class="card robot-card${r.image ? "" : " no-photo"}" href="${robotUrl(r)}"${ck(`ROBOTS[${i}]`)}>
      ${r.image
        ? `<img${imgAttrs(r.image, 800)}${imgPos(r)}${ck(`ROBOTS[${i}].image`)} alt="${esc(altFor(r.image, `${robotName(r)}, the ${r.year} robot`))}" loading="lazy" />`
        : `<div class="photo-wanted"${ck(`ROBOTS[${i}].image`, "image")}><span aria-hidden="true" data-ck-ignore>${esc(r.year)}</span>Photo wanted</div>`}
      <div class="card-body">
        <div class="meta"><span${ck(`ROBOTS[${i}].year`)}>${esc(r.year)}</span> · <span${ck(`ROBOTS[${i}].game`)}>${esc(r.game)}</span></div>
        <h3${ck(`ROBOTS[${i}].name`)}>${esc(robotName(r))}</h3>
        ${r.tagline ? `<p${ck(`ROBOTS[${i}].tagline`)}>${esc(r.tagline)}</p>` : ""}
        ${r.stats ? `<p class="stats-line"${ck(`ROBOTS[${i}].stats`)}>${esc(r.stats)}</p>` : ""}
      </div>
    </a>
  `).join("");

  document.getElementById("archive-ask").innerHTML = `We don't have photos or names for many of
    our older robots. Were you on the team? Send photos, robot names, or stories to
    <a href="mailto:${esc(SITE.email)}"${ck("SITE.email")}>${esc(SITE.email)}</a>.`;
});
</script>
</body>
</html>
