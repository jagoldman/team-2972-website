<!DOCTYPE html>
<html lang="en" data-site="public">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRC Robots | Team 2972 Gears & Buccaneers</title>
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/pwa-icons/site/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/pwa-icons/site/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/pwa-icons/site/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Team 2972" />
<!-- bumper: the accent colour a visitor picked with Home's bumper, set before the first paint so a red choice never
     shows blue first. It reads one stored value and sets one attribute; nothing else (test/theme-test.cjs). -->
<script>try{var a=localStorage.getItem("2972-alliance");if(a==="red"||a==="blue")document.documentElement.setAttribute("data-alliance",a)}catch(e){}</script>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>

<main id="robots-page"></main>

<div id="site-footer"></div>

<script src="config.js"></script>
<script src="js/content.js"></script>
<script src="js/content-loader.js"></script>
<script src="js/components.js"></script>
<script>
// Filters over the robots. The choice is kept while the page is re-rendered (the editor's live preview).
let robotFilter = "all";
const FILTERS = [["all", "All"], ["win", "Event winners"], ["po", "Playoffs"], ["svc", "In service"]];
const GALLERY_SIZES = "(min-width: 1240px) 380px, (min-width: 900px) 30vw, (min-width: 600px) 50vw, 100vw";
const hasResult = (r, test) => (r.results || []).some((x) => test(resultType(x.result)));
function passes(r, f) {
  if (f === "win") return hasResult(r, (t) => t === "win");
  if (f === "po") return hasResult(r, (t) => t !== "played");
  if (f === "svc") return r.status === "In service";
  return true;
}

// One robot: its photo and words, one link to its page. A season without a photo shows a "Photo wanted" tile that is a
// link to the team's address of its own, so the words beside it are a second link (links cannot nest).
function robotItem(r, i) {
  const P = `ROBOTS[${i}]`;
  const meta = robotMeta(r, i, { status: true, line: "stats" });
  if (r.image) return `<li${ck(P)}><a class="robot-a" href="${robotUrl(r)}">${robotShot(r, i, GALLERY_SIZES)}${meta}</a></li>`;
  const wanted = `mailto:${esc(SITE.email)}?subject=${encodeURIComponent(`Photo of the ${r.year} robot`)}`;
  return `<li${ck(P)}><a class="shot r43" href="${wanted}" aria-label="Photo wanted: send us a photo of the ${esc(r.year)} robot"${ck(`${P}.image`, "image")}><span class="ph"><b data-ck-ignore>${esc(r.year)}</b><span>Photo wanted</span></span></a>` +
    `<a class="robot-a" href="${robotUrl(r)}">${meta}</a></li>`;
}

function gridHtml() {
  const shown = ROBOTS.map((r, i) => ({ r, i })).filter(({ r }) => passes(r, robotFilter));
  return { count: `Showing ${shown.length} of ${ROBOTS.length}`, html: shown.map(({ r, i }) => robotItem(r, i)).join("") };
}

// The competition milestones ("Highlights"): the comp items of HISTORY. The team milestones are on the About page.
function highlights() {
  const rows = [];
  HISTORY.milestones.forEach((m, i) => (m.items || []).forEach((it, j) => {
    if (it.kind === "comp") rows.push(`<li><b${ck(`HISTORY.milestones[${i}].year`)}>${esc(m.year)}</b><span${ck(`HISTORY.milestones[${i}].items[${j}].text`, "rich")}>${rich(it.text)}</span></li>`);
  }));
  return rows.length ? `<h2 class="h2-gap">Highlights</h2><ul class="dated"${ck("HISTORY.milestones")}>${rows.join("")}</ul>` : "";
}

function renderRobots() {
  const g = gridHtml();
  document.getElementById("robots-page").innerHTML = `
    <section class="band band-first"><div class="wrap"><h1 tabindex="-1">Our robots</h1><p class="lead">Every robot we have built, season by season.</p>
      <div class="robots-record">${seasonSummary()}<div id="season-log"></div></div>${highlights()}</div></section>
    <section class="band band-floor"><div class="wrap"><h2>Every robot</h2>
      <div class="filters" role="group" aria-label="Filter robots">${FILTERS.map(([v, label]) => `<button type="button" class="filter" data-ck-ignore data-filter="${v}" aria-pressed="${robotFilter === v}">${label}</button>`).join("")}</div>
      <p class="small mute tab count" id="count" aria-live="polite">${g.count}</p>
      <ul class="gallery" id="robot-archive"${ck("ROBOTS")}>${g.html}</ul></div></section>
    <section class="band"><div class="wrap stack"><h2>Help us fill in the archive</h2><p class="measure">We don't have photos or names for many of our older robots. Were you on the team? Send photos, robot names, or stories to</p><p>${siteAddress()}</p></div></section>`;
  seasonLog(document.getElementById("season-log"), { list: false });
  document.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => {
    robotFilter = b.getAttribute("data-filter");
    const next = gridHtml();
    document.getElementById("robot-archive").innerHTML = next.html;
    document.getElementById("count").textContent = next.count;
    document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
}

let robotsWired = false;
onContent(() => {
  renderRobots();
  if (robotsWired) return;
  robotsWired = true;
  // The season log opens at the newest year on a phone, again once fonts and photos have changed its width.
  addEventListener("load", () => scrollLogToNewest(document, { unlessMoved: true }));
});
</script>
</body>
</html>
